<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>病人衛教資訊圖表</title>
<meta name="description" content="心臟科 A5 病人衛教資訊圖表，可線上檢視或下載列印。">
<style>
  :root{--bg:#f4f9fa;--card:#fff;--line:#d9e5ea;--ink:#18334d;--sub:#5b6e80;--brand:#15a99d}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1720;--card:#161f2a;--line:#27333f;--ink:#e8f1f5;--sub:#9fb1bf}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.7 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 56px}
  a.back{display:inline-block;color:var(--sub);text-decoration:none;font-size:.9rem;margin-bottom:10px}
  h1{font-size:1.35rem;margin:.2em 0 .1em}
  p.lead{color:var(--sub);margin:.2em 0 1.2em;font-size:.95rem}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:10px;box-shadow:0 2px 10px rgba(24,51,77,.08)}
  .sheet img{display:block;width:100%;height:auto;border-radius:6px}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 8px}
  .btns a{flex:1 1 190px;text-align:center;text-decoration:none;padding:12px 16px;border-radius:10px;
          background:var(--brand);color:#fff;font-weight:700}
  .btns a.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
  .cards a{display:block;text-decoration:none;color:inherit;background:var(--card);
           border:1px solid var(--line);border-radius:14px;padding:14px;
           box-shadow:0 2px 10px rgba(24,51,77,.08)}
  .cards img{display:block;width:100%;height:auto;border-radius:8px;margin-bottom:10px}
  .cards h2{font-size:1.02rem;margin:0 0 4px}
  .cards p{margin:0;color:var(--sub);font-size:.88rem}
  footer{color:var(--sub);font-size:.82rem;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>病人衛教資訊圖表</h1>
<p class="lead">心臟科 A5 衛教單張，可放大檢視或下載列印。每張單張右上角的 QR code 會連到這裡的對應頁面。</p>
<div class="cards">
<a href="af/"><img src="af/af-ablation.svg" alt="心房顫動電燒手術衛教單縮圖"><h2>心房顫動｜心律不整電燒手術</h2><p>適合對象、成功率、兩種技術比較、健保與自費費用（附詳細版）</p></a>
<a href="brady/"><img src="brady/bradycardia.svg" alt="心率過慢衛教單縮圖"><h2>心率過慢｜安心觀察指南</h2><p>病竇症候群／房室傳導阻滯，未裝節律器的自我照顧</p></a>
<a href="af-intro/"><img src="af-intro/af-basics.svg" alt="認識心房顫動衛教單縮圖"><h2>認識心房顫動</h2><p>什麼是心房顫動、為什麼會中風、抗凝血藥怎麼吃（附詳細版）</p></a>
<a href="af-meds/"><img src="af-meds/af-meds.svg" alt="心房顫動用藥指南衛教單縮圖"><h2>心房顫動的用藥指南</h2><p>為什麼要吃兩種藥、抗凝血藥怎麼吃、亞洲人的用藥考量（附詳細版）</p></a>
</div>
<footer>本衛教資訊供醫病共同決策參考，<strong>不取代個別診療</strong>；實際治療方式請與您的心臟科／電生理醫師討論。</footer>
</div>
</body>
</html>
