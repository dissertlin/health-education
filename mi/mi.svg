<metadata><rdf:RDF><rdf:Description rdf:about=""><dc:title>認識心肌梗塞</dc:title><dc:creator>林祐賸醫師</dc:creator><dc:rights>© 2026 林祐賸醫師 保留所有權利</dc:rights><dc:source>https://dissertlin.github.io/health-education/mi/</dc:source></rdf:Description></rdf:RDF></metadata>
<defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b33a2b"/><stop offset="1" stop-color="#7a2440"/></linearGradient><filter id="sh" x="-6%" y="-6%" width="112%" height="118%"><feDropShadow dx="0" dy="1.1" stdDeviation="1.5" flood-color="#4a1f22" flood-opacity=".10"/></filter><style>
.t{font:700 23px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#fff}
.st{font:600 10.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#fbe3e0}
.h{font:700 14.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#4a1f22}
.b{font:700 10.2px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#5a2a2c}
.s{font:500 8.7px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#6b5052}
.xs{font:500 7.2px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#836669}
.src{font:500 6.4px 'Microsoft JhengHei',sans-serif;fill:#f0e2e2}
.srh{font:700 6.8px 'Microsoft JhengHei',sans-serif;fill:#fff}
.card{fill:#fff;stroke:#ecdcdc;stroke-width:1.3}
.line{stroke-linecap:round;stroke-linejoin:round}
</style></defs>
<rect width="559" height="794" fill="#fdf8f7"/>
<rect x="14" y="14" width="531" height="96" rx="16" fill="url(#hg)"/>
<text x="36" y="52" class="t">認識心肌梗塞</text>
<text x="36" y="76" class="st">血管突然被血栓塞住，心肌正在壞死——<tspan style="font-weight:700;fill:#fff">每一分鐘都算數</tspan></text>
<text x="36" y="95" class="st">看懂症狀、知道要打 119、了解治療與復健</text>
<rect x="20" y="118" width="519" height="152" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="140" class="h">什麼是心肌梗塞？有什麼症狀？</text>
<text x="252" y="140" class="xs">斑塊破裂 → 血栓塞住 → 心肌開始壞死</text>
<rect x="40" y="150" width="138" height="42" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="109" y="164" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">正常</text>
<path d="M54 178h110" stroke="#e8c9c4" stroke-width="11" stroke-linecap="round"/>
<rect x="185" y="150" width="138" height="42" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="254" y="164" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">斑塊變窄</text>
<path d="M199 178h110" stroke="#e8c9c4" stroke-width="11" stroke-linecap="round"/>
<rect x="330" y="150" width="138" height="42" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="399" y="164" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">血栓完全塞住</text>
<path d="M344 178h110" stroke="#e8c9c4" stroke-width="11" stroke-linecap="round"/>
<path d="M54 178h110" stroke="#f3a9a0" stroke-width="6.5" stroke-linecap="round"/>
<path d="M199 178h110" stroke="#f3a9a0" stroke-width="6.5" stroke-linecap="round"/>
<path d="M234 174c12-4 24-4 36 0" stroke="#d6a93f" stroke-width="4.6" stroke-linecap="round" fill="none"/>
<path d="M344 178h26M404 178h15" stroke="#f3a9a0" stroke-width="6.5" stroke-linecap="round"/>
<circle cx="387" cy="178" r="10" fill="#8f2a24"/>
<text x="482" y="174" class="xs" style="fill:#a8322c;font-weight:700">血流中斷</text>
<text x="482" y="186" class="xs">心肌壞死</text>
<text x="37" y="207" class="b">典型症狀——<tspan style="fill:#a8322c">持續超過 5 分鐘不會自己好</tspan></text>
<g transform="translate(44 212)"><path d="M3 8c0-3.6 2.8-6.4 6.4-6.4 2.3 0 4 1.2 4.6 2.4.6-1.2 2.3-2.4 4.6-2.4C22.2 1.6 25 4.4 25 8c0 6.4-11 12-11 12S3 14.4 3 8z" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M2 25h5l3-5 4 9 3-4h9" fill="none" stroke="#a8322c" stroke-width="2" class="line"/></g>
<text x="58" y="248" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">胸口壓迫</text>
<g transform="translate(124 212)"><circle cx="14" cy="9" r="6.5" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M11 7.5h.01M17 7.5h.01" stroke="#a8322c" stroke-width="2.6" class="line"/><path d="M11 12.5q3 2 6 0" fill="none" stroke="#a8322c" stroke-width="1.8" class="line"/><path d="M7 19c1.5 2.2 1.5 3.8 0 5M14 19c1.5 2.2 1.5 3.8 0 5M21 19c1.5 2.2 1.5 3.8 0 5" stroke="#a8322c" stroke-width="2" class="line"/></g>
<text x="138" y="248" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">冒冷汗</text>
<g transform="translate(204 212)"><path d="M14 2v8" stroke="#a8322c" stroke-width="2" class="line"/><path d="M9 10c-4 0-7 3-7 7s2 8 5 8 4-3 4-7v-8zM19 10c4 0 7 3 7 7s-2 8-5 8-4-3-4-7v-8z" fill="none" stroke="#a8322c" stroke-width="2"/></g>
<text x="218" y="248" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">喘不過氣</text>
<g transform="translate(284 212)"><circle cx="14" cy="11" r="8" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M10.5 9h.01M17.5 9h.01" stroke="#a8322c" stroke-width="2.6" class="line"/><path d="M10 16q4-3 8 0" fill="none" stroke="#a8322c" stroke-width="2" class="line"/><path d="M11 22c1.4 2.4 4.6 2.4 6 0" fill="none" stroke="#a8322c" stroke-width="2" class="line"/></g>
<text x="298" y="248" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">噁心想吐</text>
<g transform="translate(364 212)"><circle cx="11" cy="5.5" r="4" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M11 9.5v8M11 12l-6 4M11 12l6 3.5M11 17.5l-3.5 7.5M11 17.5l3.5 7.5" stroke="#a8322c" stroke-width="2" class="line"/><path d="M21 9l5-2M21 14l6 .5M21 19l5 2.5" stroke="#a8322c" stroke-width="1.9" class="line"/></g>
<text x="378" y="248" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">痛會轉移</text>
<g transform="translate(444 212)"><circle cx="14" cy="10" r="7" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M9.5 8l3 3M12.5 8l-3 3M15.5 8l3 3M18.5 8l-3 3" stroke="#a8322c" stroke-width="1.9" class="line"/><path d="M10 15q4 3 8 0" fill="none" stroke="#a8322c" stroke-width="2" class="line"/><path d="M3 23l4-3M25 23l-4-3" stroke="#a8322c" stroke-width="1.8" class="line"/></g>
<text x="458" y="248" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">快要昏倒</text>
<rect x="36" y="252" width="487" height="16" rx="7" fill="#fdeeeb"/>
<text x="48" y="263" class="xs" style="fill:#a8322c"><tspan style="font-weight:700">特別注意：</tspan>女性、長輩、糖尿病人常<tspan style="font-weight:700">不會胸痛</tspan>，可能只覺得喘、累、噁心或上腹悶，容易被當成胃病而延誤。</text>
<rect x="20" y="278" width="519" height="78" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="300" class="h">誰的風險高？</text>
<text x="152" y="300" class="xs"><tspan style="fill:#a8322c;font-weight:700">紅＝可以改變</tspan>　<tspan style="fill:#7d94a8;font-weight:700">灰＝不能改變，但更要控制其他項目</tspan></text>
<g transform="translate(44 306)"><rect x="1" y="13" width="17" height="5" rx="2" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M21 13h3v5h-3" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M14 9c0-2.5-3-2.5-3-5s2.5-2.5 2.5-2.5" fill="none" stroke="#a8322c" stroke-width="1.8" class="line"/><path d="M2 21L22 2" stroke="#a8322c" stroke-width="2.2" class="line"/></g>
<text x="56" y="348" class="xs" text-anchor="middle" style="font-weight:700;fill:#a8322c">抽菸</text>
<g transform="translate(113 306)"><circle cx="12" cy="11" r="9" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M4 11h3l2-5 3 10 2-5h4" fill="none" stroke="#a8322c" stroke-width="1.9" class="line"/><path d="M20 4l4-3" stroke="#a8322c" stroke-width="1.8" class="line"/></g>
<text x="125" y="348" class="xs" text-anchor="middle" style="font-weight:700;fill:#a8322c">高血壓</text>
<g transform="translate(182 306)"><rect x="2" y="7" width="20" height="8" rx="4" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M9 6q9-1.5 13 4-8 3.5-13 2z" fill="#e8c05a" stroke="#a8322c" stroke-width="1.4"/><path d="M2 20h20" stroke="#a8322c" stroke-width="1.8" class="line"/></g>
<text x="194" y="348" class="xs" text-anchor="middle" style="font-weight:700;fill:#a8322c">高血脂</text>
<g transform="translate(251 306)"><path d="M12 1c4 5 7 8.5 7 11.5A7 7 0 1 1 5 12.5C5 9.5 8 6 12 1z" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M8 21h8" stroke="#a8322c" stroke-width="1.8" class="line"/></g>
<text x="263" y="348" class="xs" text-anchor="middle" style="font-weight:700;fill:#a8322c">糖尿病</text>
<g transform="translate(320 306)"><circle cx="12" cy="4.5" r="3.5" fill="none" stroke="#a8322c" stroke-width="2"/><ellipse cx="12" cy="14" rx="7.5" ry="6" fill="none" stroke="#a8322c" stroke-width="2"/><path d="M8 20l-1.5 4M16 20l1.5 4" stroke="#a8322c" stroke-width="2" class="line"/></g>
<text x="332" y="348" class="xs" text-anchor="middle" style="font-weight:700;fill:#a8322c">肥胖少動</text>
<g transform="translate(389 306)"><circle cx="6" cy="5" r="3.4" fill="none" stroke="#7d94a8" stroke-width="2"/><circle cx="18" cy="5" r="3.4" fill="none" stroke="#7d94a8" stroke-width="2"/><circle cx="12" cy="18" r="3.4" fill="none" stroke="#7d94a8" stroke-width="2"/><path d="M6 9v4h12V9M12 13v1.5" stroke="#7d94a8" stroke-width="1.8" class="line" fill="none"/></g>
<text x="401" y="348" class="xs" text-anchor="middle" style="font-weight:700;fill:#7d94a8">家族史</text>
<g transform="translate(458 306)"><circle cx="12" cy="11" r="9" fill="none" stroke="#7d94a8" stroke-width="2"/><path d="M12 5.5v6l4 2.5" stroke="#7d94a8" stroke-width="2" class="line" fill="none"/></g>
<text x="470" y="348" class="xs" text-anchor="middle" style="font-weight:700;fill:#7d94a8">年齡與性別</text>
<rect x="20" y="364" width="519" height="72" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="386" class="h">有多危險？</text>
<text x="140" y="386" class="xs" style="fill:#a8322c;font-weight:700">時間就是心肌——越晚打通，壞死越多、心臟功能掉越多</text>
<rect x="36" y="392" width="159" height="38" rx="9" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="115" y="406" class="b" text-anchor="middle" style="fill:#a8322c">前幾小時</text>
<text x="115" y="417" class="xs" text-anchor="middle">最危險的時段</text>
<text x="115" y="427" class="xs" text-anchor="middle">可能突發致命心律不整</text>
<rect x="200" y="392" width="159" height="38" rx="9" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="279" y="406" class="b" text-anchor="middle" style="fill:#a8322c">90 分鐘</text>
<text x="279" y="417" class="xs" text-anchor="middle">到院後打通血管的目標</text>
<text x="279" y="427" class="xs" text-anchor="middle">台灣的照護品質指標</text>
<rect x="364" y="392" width="159" height="38" rx="9" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="443" y="406" class="b" text-anchor="middle" style="fill:#a8322c">不要自己開車</text>
<text x="443" y="417" class="xs" text-anchor="middle">路上失去意識會更糟</text>
<text x="443" y="427" class="xs" text-anchor="middle">救護車上就能做心電圖</text>
<rect x="20" y="444" width="519" height="94" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="466" class="h">醫師會怎麼治療？</text>
<text x="178" y="466" class="xs">首選是<tspan style="font-weight:700;fill:#a8322c">緊急心導管</tspan>，把塞住的血管盡快打通</text>
<rect x="36" y="474" width="238" height="56" rx="9" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="48" y="488" class="b" style="fill:#a8322c">緊急心導管（主要做法）</text>
<text x="48" y="500" class="xs">從手腕或鼠蹊部放入導管，找到塞住的地方</text>
<text x="48" y="511" class="xs">抽出血栓、以氣球撐開，多數會放支架固定</text>
<text x="48" y="522" class="xs">健保全額給付傳統支架；塗藥支架需自付差額</text>
<rect x="285" y="474" width="238" height="56" rx="9" fill="#fff" stroke="#eadede"/>
<text x="297" y="488" class="b">出院後的藥一定要吃</text>
<text x="297" y="500" class="xs">兩種抗血小板藥<tspan style="font-weight:700;fill:#a8322c">至少吃滿一年</tspan>，自行停藥</text>
<text x="297" y="511" class="xs">可能造成支架內急性血栓，後果嚴重</text>
<text x="297" y="522" class="xs">另有降血脂等長期用藥；乙型阻斷劑依心臟功能決定</text>
<rect x="20" y="546" width="519" height="72" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="568" class="h">什麼時候能回到原本的生活？</text>
<text x="246" y="568" class="xs">以下為一般情況，<tspan style="font-weight:700">實際請由醫師依您的心臟功能決定</tspan></text>
<rect x="40" y="576" width="92" height="32" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="86" y="589" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">走路</text>
<text x="86" y="601" class="xs" text-anchor="middle">出院後就開始</text>
<rect x="140" y="576" width="92" height="32" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="186" y="589" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">開車</text>
<text x="186" y="601" class="xs" text-anchor="middle">約 1～2 週</text>
<rect x="240" y="576" width="92" height="32" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="286" y="589" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">性生活</text>
<text x="286" y="601" class="xs" text-anchor="middle">約 3 週</text>
<rect x="340" y="576" width="92" height="32" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="386" y="589" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">回去上班</text>
<text x="386" y="601" class="xs" text-anchor="middle">多數 1～3 個月</text>
<rect x="440" y="576" width="92" height="32" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="486" y="589" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">勞力工作</text>
<text x="486" y="601" class="xs" text-anchor="middle">需個別評估</text>
<text x="37" y="614" class="xs">職業駕駛另有規定；裝有去顫器或心臟功能較差者，上述時間都會不同。</text>
<rect x="20" y="626" width="519" height="66" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="648" class="h">心臟復健：不是多休息，是要動起來</text>
<text x="278" y="648" class="xs" style="fill:#a8322c;font-weight:700">可降低再梗塞與死亡率</text>
<rect x="36" y="656" width="159" height="28" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="115" y="668" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">第一期　住院中</text>
<text x="115" y="679" class="xs" text-anchor="middle">下床、走動，減少臥床併發症</text>
<rect x="200" y="656" width="159" height="28" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="279" y="668" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">第二期　出院後</text>
<text x="279" y="679" class="xs" text-anchor="middle">醫院監測下的運動訓練，健保有療程</text>
<rect x="364" y="656" width="159" height="28" rx="8" fill="#fdf2f0" stroke="#f0d7d3"/>
<text x="443" y="668" class="xs" text-anchor="middle" style="font-weight:700;fill:#8c3a33">第三期　長期</text>
<text x="443" y="679" class="xs" text-anchor="middle">把運動變成生活習慣，自己維持</text>
<rect x="20" y="700" width="519" height="50" rx="13" fill="#fdeeeb" stroke="#f0c3bc" stroke-width="1.4"/>
<circle cx="44" cy="716" r="9" fill="#b83329"/>
<text x="44" y="720" class="b" text-anchor="middle" style="fill:#fff">!</text>
<text x="60" y="719" class="h" style="fill:#a8322c">出現這些情況，立刻打 119</text>
<text x="60" y="734" class="s" style="fill:#8c3a33">胸口壓迫或悶痛<tspan style="font-weight:700">超過 5 分鐘不緩解</tspan>　‧　含了硝化甘油仍沒有改善　‧　冒冷汗、喘不過氣、快要昏倒</text>
<text x="60" y="745" class="xs" style="fill:#a8322c"><tspan style="font-weight:700">不要自己開車、不要等家人載</tspan>——救護車上就能做心電圖並事先通知醫院準備，比你自己到院快得多。</text>
<rect x="20" y="756" width="519" height="34" rx="11" fill="url(#hg)"/>
