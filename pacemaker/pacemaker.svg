<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 559 794">
<defs><style>
.t{font:700 23px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#153b48}
.st{font:600 11.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#3f6a76}
.h{font:700 15.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#153b48}
.b{font:700 10.6px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#26404d}
.s{font:500 9px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#4e626e}
.xs{font:500 7.3px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#6a7a85}
.src{font:500 6.5px 'Microsoft JhengHei',sans-serif;fill:#dfeaf0}
.srh{font:700 6.9px 'Microsoft JhengHei',sans-serif;fill:#fff}
.card{fill:#fff;stroke:#d5e6ea;stroke-width:1.4}
.line{stroke-linecap:round;stroke-linejoin:round}
</style><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#153b48" flood-opacity=".12"/></filter></defs>
<rect width="559" height="794" fill="#f4fafb"/>
<path d="M0 0h559v112H0z" fill="#dff3f5"/><circle cx="516" cy="18" r="56" fill="#bde7e8" opacity=".65"/>

<g transform="translate(24 16)">
<path d="M45 22C31 6 6 17 10 41c3 18 35 34 35 34s32-16 35-34C84 17 59 6 45 22z" fill="#ef6b73" stroke="#c94555" stroke-width="2"/>
<circle cx="33" cy="38" r="2.8" fill="#263746"/><circle cx="57" cy="38" r="2.8" fill="#263746"/>
<path d="M37 49q8 7 16 0" fill="none" stroke="#263746" stroke-width="2" class="line"/>
<rect x="62" y="52" width="21" height="26" rx="5" fill="#9fb4c0" stroke="#6c8593" stroke-width="2"/>
<path d="M66 58h13M66 64h13" stroke="#fff" stroke-width="2"/>
<path d="M62 62q-12 2-18 10" fill="none" stroke="#6c8593" stroke-width="2.4" class="line"/>
</g>
<text x="118" y="40" class="t">裝置心臟節律器｜生活注意事項</text>
<text x="118" y="65" class="st">心跳太慢或停頓時，節律器送出微小電流，幫心臟規律跳動</text>
<rect x="118" y="77" width="316" height="21" rx="10.5" fill="#fff"/>
<text x="131" y="91" class="s">它是心臟的「備用小幫手」，只在需要時出手，不會取代心臟</text>

<!-- A 為什麼要裝 -->
<rect x="20" y="124" width="519" height="78" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="146" class="h">為什麼需要裝節律器？</text>
<g transform="translate(38 152)"><circle cx="14" cy="14" r="14" fill="#ffe0e2"/>
<path d="M5 15h4l3-7 4 14 3-7h5" fill="none" stroke="#d9535f" stroke-width="2.1" class="line"/>
<text x="38" y="11" class="b">心跳太慢或會停一下</text><text x="38" y="25" class="s">例如病竇症候群、房室傳導阻滯</text></g>
<g transform="translate(290 152)"><circle cx="14" cy="14" r="14" fill="#fff2cf"/>
<circle cx="14" cy="12" r="5.5" fill="none" stroke="#d29a24" stroke-width="2"/><path d="M14 17.5v5M8.5 23h11" stroke="#d29a24" stroke-width="2" class="line"/>
<text x="38" y="11" class="b">改善心跳慢造成的不舒服</text><text x="38" y="25" class="s">頭暈、昏倒、喘、累、沒力氣</text></g>
<rect x="37" y="184" width="485" height="15" rx="7.5" fill="#eaf6f7"/>
<text x="279" y="195" text-anchor="middle" class="xs" style="font-weight:700;fill:#166273">目標是預防昏倒與意外、維持安全的心跳；是否需要裝由心臟科醫師評估。</text>

<!-- NEW 兩種節律器 -->
<rect x="20" y="212" width="519" height="118" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="234" class="h">現在有兩種節律器</text>
<text x="185" y="234" class="xs">目標一樣，差別在有沒有導線、傷口在哪裡</text>
<rect x="36" y="246" width="236" height="72" rx="11" fill="#eef4fb" stroke="#b9d3ea"/>
<g transform="translate(48 256)"><rect x="0" y="0" width="11" height="15" rx="3" fill="#7aa7d4"/><path d="M2.5 4.5h6M2.5 8.5h6" stroke="#fff" stroke-width="1.4"/><path d="M11 6.5q9 1 13 7.5" fill="none" stroke="#7aa7d4" stroke-width="2" class="line"/></g>
<text x="78" y="268" class="b" style="fill:#22599a">傳統節律器（有導線）</text>
<text x="48" y="286" class="s">機器放鎖骨下皮下，導線經血管進心臟</text>
<text x="48" y="299" class="s">胸前有傷口與小凸起，術後手臂要限制</text>
<text x="48" y="312" class="s">使用最久、資料最完整；可做雙腔與 CRT</text>
<rect x="287" y="246" width="236" height="72" rx="11" fill="#eef8f2" stroke="#a9d5cd"/>
<g transform="translate(299 256)"><rect x="0" y="0" width="9" height="15" rx="4.5" fill="#3f9184"/><path d="M9 7.5h4" stroke="#3f9184" stroke-width="1.8" class="line"/><path d="M13 2.5q8 5 0 10" fill="none" stroke="#3f9184" stroke-width="1.8" class="line"/></g>
<text x="326" y="268" class="b" style="fill:#08766d">無導線節律器（膠囊型）</text>
<text x="299" y="286" class="s">膠囊大小，經鼠蹊部血管直接放進心臟</text>
<text x="299" y="299" class="s">胸前沒有傷口與導線，外觀看不出來</text>
<text x="299" y="312" class="s">健保限特定條件給付，多數需自費</text>

<!-- B 傷口 -->
<rect x="20" y="340" width="253" height="170" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="362" class="h">傷口這樣照顧</text>
<g transform="translate(38 371)"><circle cx="10" cy="10" r="10" fill="#e3f4ef"/><path d="M5.5 11h9M10 6.5v9" stroke="#3f9184" stroke-width="2.2" class="line"/>
<text x="28" y="7" class="b">保持清潔乾燥</text><text x="28" y="20" class="s">換藥與洗澡方式依醫療團隊指示</text></g>
<g transform="translate(38 407)"><circle cx="10" cy="10" r="10" fill="#eef1fa"/><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" stroke="#6b73a8" stroke-width="2.2" class="line"/>
<text x="28" y="7" class="b">不要摳抓、不自己塗藥</text><text x="28" y="20" class="s">傷口癒合前不泡澡、不游泳</text></g>
<g transform="translate(38 443)"><circle cx="10" cy="10" r="10" fill="#fff2cf"/><circle cx="10" cy="10" r="4" fill="none" stroke="#d29a24" stroke-width="2"/>
<text x="28" y="7" class="b">每天看一次傷口</text><text x="28" y="20" class="s">注意紅、腫、熱、痛、流湯或裂開</text></g>
<rect x="36" y="472" width="221" height="32" rx="9" fill="#fff0ed"/>
<text x="47" y="486" class="b" style="fill:#a5423d">這些要盡快聯絡醫療團隊</text>
<text x="47" y="499" class="s" style="fill:#a5423d">發燒、流膿或出血不止、腫脹變大</text>

<!-- C 回家後 -->
<rect x="287" y="340" width="252" height="170" rx="13" class="card" filter="url(#sh)"/>
<text x="304" y="362" class="h">回家後注意事項</text>
<g transform="translate(305 371)"><circle cx="10" cy="10" r="10" fill="#e3f4ef"/><path d="M10 15.5V5.5M6.5 9l3.5-3.5L13.5 9" fill="none" stroke="#3f9184" stroke-width="2" class="line"/>
<text x="28" y="7" class="b">手臂適度活動</text><text x="28" y="20" class="s">有導線者三個月內別高舉過肩或提重物</text></g>
<g transform="translate(305 407)"><circle cx="10" cy="10" r="10" fill="#e8f2ff"/><rect x="5.5" y="6.5" width="9" height="7" rx="1.4" fill="none" stroke="#3477c5" stroke-width="1.9"/>
<text x="28" y="7" class="b">隨身帶節律器識別卡</text><text x="28" y="20" class="s">看病、看牙、做檢查前主動告知</text></g>
<g transform="translate(305 443)"><circle cx="10" cy="10" r="10" fill="#f3edfb"/><path d="M10 10V5.5M10 10l3.5 2.5" stroke="#6d5ba7" stroke-width="2" class="line"/>
<text x="28" y="7" class="b">按時回診檢查節律器</text><text x="28" y="20" class="s">術後約 1 個月、3 個月，之後定期</text></g>
<rect x="303" y="472" width="220" height="32" rx="9" fill="#eef4fb"/>
<text x="314" y="486" class="b" style="fill:#22599a">可能會安排遠距監測</text>
<text x="314" y="499" class="s" style="fill:#22599a">部分裝置能在家把資料傳回醫院</text>

<!-- D 電器與環境 -->
<rect x="20" y="520" width="519" height="104" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="542" class="h">生活中的電器與環境</text>
<rect x="36" y="552" width="240" height="62" rx="10" fill="#eef8f2"/>
<text x="49" y="569" class="b" style="fill:#2b7a53">這些可以正常使用</text>
<text x="49" y="584" class="s">手機（別放同側胸前口袋，用對側接聽）</text>
<text x="49" y="597" class="s">微波爐、家電、電腦；電磁爐距離 60 公分</text>
<text x="49" y="610" class="s">機場安檢：出示識別卡，請改人工檢查</text>
<rect x="284" y="552" width="239" height="62" rx="10" fill="#fff3ee"/>
<text x="297" y="569" class="b" style="fill:#a5533d">這些一定要先告知</text>
<text x="297" y="584" class="s">核磁共振 MRI：多數新裝置可做，但須由</text>
<text x="297" y="597" class="s">團隊事前設定；電燒、電療、碎石術也一樣</text>
<text x="297" y="610" class="s">避開：電焊、強力磁鐵、大型工業馬達</text>

<!-- E 電池 -->
<rect x="20" y="634" width="519" height="62" rx="13" fill="#fff7e3" stroke="#edc86d" stroke-width="1.6"/>
<text x="37" y="655" class="h">電池可以用多久？</text>
<text x="37" y="673" class="s">兩種都約可用 <tspan style="font-weight:700">8～12 年</tspan>，每次回診檢查電量；快沒電會提早幾個月通知，不會突然停掉。</text>
<text x="37" y="688" class="s" style="fill:#8a6414">提醒：節律器負責「不要太慢」，<tspan style="font-weight:700">不能預防心肌梗塞或中風</tspan>，原本的藥還是要照吃。</text>

<!-- 緊急 -->
<rect x="20" y="706" width="519" height="24" rx="10" fill="#fff0ed"/>
<text x="279" y="722" text-anchor="middle" class="b" style="fill:#bd354a">昏倒、胸痛、呼吸困難、持續心悸，或傷口大量出血：立即打 119</text>

<!-- 來源 -->
<rect x="20" y="738" width="519" height="46" rx="9" fill="#244e67"/>
<text x="31" y="752" class="srh">資料來源（查核至 2026-09）：</text>
<text x="31" y="763" class="src">2021 ESC Guidelines on Cardiac Pacing and CRT；2018 ACC/AHA/HRS Bradycardia Guideline；</text>
<text x="31" y="773" class="src">2025 ACC/AHA/HRS Appropriate Use Criteria for ICD, CRT and Pacing；中央健保署自付差額特材公告。</text>
<text x="31" y="781" class="src">本單張提供一般衛教，不取代個別診療；實際限制、適用裝置與費用請依您的醫療團隊說明。</text>
<text x="535" y="791" text-anchor="end" class="xs">A5 直式｜裝置心臟節律器病人衛教</text>
