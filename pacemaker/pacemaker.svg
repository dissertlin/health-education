31h1v1h-1zM24 31h1v1h-1zM0 32h7v1h-7zM8 32h4v1h-4zM14 32h1v1h-1zM16 32h1v1h-1zM18 32h1v1h-1zM21 32h1v1h-1zM24 32h2v1h-2zM28 32h2v1h-2zM31 32h1v1h-1z" fill="#10283a"/></g><text x="499" y="92" text-anchor="middle" style="font:700 8.4px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#3f6a76">掃描看電子版</text></g><!--/QR--></svg>
