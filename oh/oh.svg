<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>姿態性低血壓｜起身不暈指南｜A5 病人衛教單張</dc:title><dc:creator>林祐賸醫師</dc:creator><dc:rights>© 2026 林祐賸醫師 編製。本單張僅供臨床衛教使用，未經同意不得重製、改作或作商業用途。</dc:rights><dc:source>https://dissertlin.github.io/health-education/oh/</dc:source></rdf:Description></rdf:RDF></metadata>
<defs><style>
.t{font:700 25px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173650}.st{font:700 13px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#42657a}.h{font:700 17px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#173650}.b{font:600 13px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#263947}.s{font:500 11px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#485964}.xs{font:500 9px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#66737c}.card{fill:#fff;stroke:#d6e6ea;stroke-width:1.5}.line{stroke-linecap:round;stroke-linejoin:round}</style><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173650" flood-opacity=".12"/></filter></defs>
<rect width="559" height="794" fill="#fdf6f7"/><path d="M0 0h559v112H0z" fill="#fbe7ea"/><circle cx="510" cy="15" r="58" fill="#f3c3cd" opacity=".7"/>
<!-- 起身人物 -->
<g transform="translate(23 18)"><circle cx="42" cy="17" r="13" fill="#ffd7b5"/><path d="M31 14q11-18 23 0" fill="#4d6f8b"/><path d="M42 31l-3 25M40 40L23 50M40 41l17 7M39 56L27 75M39 56l14 20" fill="none" stroke="#4f89a0" stroke-width="7" class="line"/><path d="M10 11l-7-5M13 22l-9 2M18 3l-3-8" stroke="#e1a624" stroke-width="2" class="line"/></g>
<text x="112" y="42" class="t">姿態性低血壓｜起身不暈指南</text><text x="112" y="70" class="st">從躺、坐到站立時血壓下降，可能頭暈、眼前發黑或跌倒</text><rect x="112" y="82" width="336" height="22" rx="11" fill="#fff"/><text x="127" y="97" class="s">重點口訣：慢慢起、先坐穩、有症狀立刻坐下或躺下</text>
<!-- 症狀 -->
<rect x="20" y="127" width="519" height="129" rx="14" class="card" filter="url(#sh)"/><text x="37" y="156" class="h">身體可能出現這些訊號</text>
<g transform="translate(38 173)"><circle cx="22" cy="19" r="15" fill="#ffd7b5"/><path d="M9 14q13-19 26 0" fill="#536f8b"/><path d="M7 3L1-3M37 3l6-6M22 0v-8" stroke="#e4aa26" stroke-width="2"/><path d="M12 38q10-11 21 0" fill="#72b1bf"/><text x="48" y="16" class="b">頭暈、眼前發黑</text><text x="48" y="35" class="s">虛弱、站不穩</text></g>
<g transform="translate(284 173)"><path d="M20 5C9-6-5 3-2 18c2 11 22 22 22 22s20-11 22-22C45 3 31-6 20 5z" fill="#ec6c74"/><path d="M-3 22h10l4-8 6 16 5-11 4 3h17" fill="none" stroke="#fff" stroke-width="2"/><text x="55" y="16" class="b">心悸、視力模糊</text><text x="55" y="35" class="s">甚至昏倒、跌倒</text></g>
<rect x="37" y="226" width="484" height="21" rx="10" fill="#fff0ed"/><text x="51" y="241" class="s" style="fill:#a53d34">若昏倒、胸痛、呼吸困難、單側無力或說話不清：立即打 119</text>
<!-- 成因 -->
<rect x="20" y="271" width="253" height="286" rx="14" class="card" filter="url(#sh)"/><text x="37" y="300" class="h">為什麼會發生？</text>
<g transform="translate(38 317)"><path d="M12 2h15v30H12z" fill="#78b7d1"/><path d="M15 8h9" stroke="#fff" stroke-width="2"/><path d="M7 32h25" stroke="#4d7180" stroke-width="3" class="line"/><text x="45" y="13" class="b">身體的水分不夠</text><text x="45" y="31" class="s">喝太少、流汗、發燒、拉肚子、出血</text></g>
<g transform="translate(38 363)"><rect x="3" y="5" width="30" height="19" rx="10" fill="#f4b83e"/><path d="M18 5v19" stroke="#fff" stroke-width="2"/><text x="45" y="13" class="b">藥物引起（最常見）</text><text x="45" y="31" class="s">降血壓藥、利尿劑及部分攝護腺、</text><text x="45" y="46" class="s">心臟、抗憂鬱或安眠藥等</text></g>
<g transform="translate(38 422)"><circle cx="18" cy="15" r="15" fill="#e9e2f8"/><path d="M18 5v20M8 15h20" stroke="#745fa5" stroke-width="3" class="line"/><text x="45" y="11" class="b">身體反應變慢</text><text x="45" y="29" class="s">年紀大、糖尿病、自律神經或心臟病</text></g><text x="38" y="478" class="xs">※ 吃飽飯後、久站、天氣熱或喝酒後會更明顯</text><rect x="36" y="495" width="221" height="54" rx="10" fill="#eaf3ff"/><text x="48" y="514" class="b" style="fill:#245e98">怎樣算姿態性低血壓？</text><text x="48" y="530" class="s">站起來 3 分鐘內，上面的血壓掉</text><text x="48" y="544" class="s">20 以上，或下面的掉 10 以上。</text>
<!-- 日常注意 -->
<rect x="287" y="271" width="252" height="286" rx="14" class="card" filter="url(#sh)"/><text x="304" y="300" class="h">平常這樣做</text>
<g transform="translate(306 316)"><circle cx="17" cy="16" r="16" fill="#e2f4ed"/><path d="M7 20h8V9h8v11h8" fill="none" stroke="#4c9980" stroke-width="3"/><text x="43" y="11" class="b">分段慢慢起身</text><text x="43" y="29" class="s">躺→坐 1–2 分鐘→扶穩站立</text></g>
<g transform="translate(306 363)"><circle cx="17" cy="16" r="16" fill="#e8f2ff"/><path d="M10 7h14l-2 20H12z" fill="#72bfe3"/><path d="M12 15h10" stroke="#fff" stroke-width="2"/><text x="43" y="11" class="b">依醫囑補充水分</text><text x="43" y="29" class="s">少量多次；炎熱或活動時更留意</text></g>
<g transform="translate(306 410)"><circle cx="17" cy="16" r="16" fill="#fff1ce"/><path d="M8 18h18M11 11h12M14 25h6" stroke="#d99a24" stroke-width="3" class="line"/><text x="43" y="11" class="b">避免誘發情境</text><text x="43" y="29" class="s">久站、過熱、酒精、突然彎腰起身</text></g>
<g transform="translate(306 467)"><rect x="2" y="2" width="30" height="29" rx="6" fill="#ffe2df"/><path d="M8 10h18M8 17h18M8 24h11" stroke="#cb584f" stroke-width="2"/><text x="43" y="11" class="b">記錄血壓與症狀</text><text x="43" y="29" class="s">依醫囑量躺／坐與站立血壓</text></g>
<!-- 起身動作 -->
<rect x="20" y="573" width="519" height="127" rx="14" fill="#fff7e3" stroke="#edc86d" stroke-width="1.7" filter="url(#sh)"/><text x="37" y="598" class="h">起身不暈的三個動作</text><circle cx="46" cy="622" r="9" fill="#d99a20"/><text x="46" y="626" text-anchor="middle" style="font:700 11px sans-serif;fill:#fff">1</text><text x="61" y="626" class="b">起身前先熱身</text><text x="37" y="648" class="s">躺著或坐著先動腳踝、</text><text x="37" y="664" class="s">握拳、繃緊大腿各 10 下</text><circle cx="209" cy="622" r="9" fill="#d99a20"/><text x="209" y="626" text-anchor="middle" style="font:700 11px sans-serif;fill:#fff">2</text><text x="224" y="626" class="b">分段慢慢起來</text><text x="200" y="648" class="s">躺 → 坐 1–2 分鐘 →</text><text x="200" y="664" class="s">扶著東西再站起來</text><circle cx="372" cy="622" r="9" fill="#d99a20"/><text x="372" y="626" text-anchor="middle" style="font:700 11px sans-serif;fill:#fff">3</text><text x="387" y="626" class="b">覺得暈就夾緊</text><text x="363" y="648" class="s">雙腿交叉用力夾緊，</text><text x="363" y="664" class="s">或立刻蹲下、坐下</text><text x="37" y="688" class="s" style="fill:#8a6414">其他有幫助的：穿彈性壓力襪或腹帶；睡覺時把頭部墊高 10～20 公分。</text>
<!-- 容易忽略的重點 -->
<rect x="20" y="708" width="519" height="74" rx="13" fill="#eef4fb" stroke="#b9d3ea"/><text x="37" y="727" class="b" style="fill:#22599a">兩個容易被忽略的重點</text><text x="37" y="747" class="s">① 藥物是最常見的原因 —— 降血壓藥、利尿劑、攝護腺藥、安眠藥都可能</text><text x="49" y="762" class="s">帶完整藥單回診請醫師檢視；但絕對不可自行停藥或減量。</text><text x="37" y="777" class="s">② 躺著時血壓反而可能偏高 —— 不要躺著吃降血壓藥；睡覺時頭部墊高有幫助。</text>
<text x="535" y="789" text-anchor="end" class="xs">A5 直式｜姿態性低血壓病人衛教｜© 2026 林祐賸醫師 編製</text>
