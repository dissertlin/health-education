<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>痛風控制｜生活大小事｜A5 病人衛教單張</dc:title><dc:creator>林祐賸醫師</dc:creator><dc:rights>© 2026 林祐賸醫師 編製。本單張僅供臨床衛教使用，未經同意不得重製、改作或作商業用途。</dc:rights><dc:source>https://dissertlin.github.io/health-education/gout/</dc:source></rdf:Description></rdf:RDF></metadata>
<defs><style>.t{font:700 24px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:white}.st{font:600 11px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#fff7e5}.h{font:700 15px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#293950}.b{font:700 10.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#344257}.s{font:500 8.7px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#566276}.xs{font:500 6.7px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#6c7686}.num{font:700 20px 'Microsoft JhengHei','Noto Sans TC',sans-serif}.line{stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#e2e5e9;stroke-width:1.3}</style><linearGradient id="g" x1="0" x2="1"><stop stop-color="#e0693e" /><stop offset="1" stop-color="#d34857" /></linearGradient><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#3c3540" flood-opacity=".12" /></filter></defs>
<rect width="559" height="794" fill="#f8f7f4" />
<!-- 標題 -->
<rect x="18" y="16" width="523" height="89" rx="16" fill="url(#g)" />
<g transform="translate(31 26)"><circle cx="28" cy="28" r="24" fill="#fff0db" /><path d="M12 36q16-29 32 0" fill="#ffd2ae" stroke="#a95735" stroke-width="2" /><circle cx="31" cy="28" r="7" fill="#e84f4f" /><path d="M32 11l5-8M40 15l8-5M44 23l9-1" stroke="#fff" stroke-width="3" class="line" /></g>
<text x="101" y="48" class="t">痛風控制｜生活大小事</text><text x="101" y="72" class="st">尿酸達標、規律用藥、聰明飲食，減少突然紅腫熱痛</text><text x="101" y="91" class="st">痛風發作時很痛，但長期控制的主角是「降低並維持尿酸」</text>
<!-- 定義 -->
<rect x="20" y="118" width="519" height="104" rx="14" class="card" filter="url(#sh)" />
<text x="36" y="142" class="h">高尿酸與痛風，有什麼不同？</text>
<g transform="translate(37 154)"><circle cx="20" cy="20" r="18" fill="#eef4ff" /><path d="M12 27q8-26 16 0" fill="#b9d0ef" /><circle cx="20" cy="14" r="4" fill="#efb63e" /><text x="48" y="10" class="b">高尿酸</text><text x="48" y="26" class="s">血中尿酸累積；約 ≥7 mg/dL 常稱偏高，但可能完全沒有症狀。</text><text x="48" y="41" class="s">單次偏高不等於一定會痛風，也不代表每個人都需吃藥。</text></g>
<g transform="translate(286 154)"><circle cx="20" cy="20" r="18" fill="#fff0ed" /><path d="M5 27q15-25 30 0" fill="#ffd1b0" stroke="#b35e39" /><circle cx="23" cy="18" r="7" fill="#eb4d53" /><text x="48" y="10" class="b">痛風</text><text x="48" y="26" class="s">尿酸結晶沉積在關節，引起突然劇痛、紅、腫、熱。</text><text x="48" y="41" class="s">反覆發作可能形成痛風石、關節傷害或腎結石。</text></g>
<!-- 目標表 -->
<text x="20" y="247" class="h">尿酸多少才適合？單位：mg/dL</text>
<rect x="20" y="260" width="519" height="166" rx="14" class="card" filter="url(#sh)" />
<rect x="36" y="274" width="112" height="60" rx="10" fill="#fff5de" /><text x="92" y="291" text-anchor="middle" class="b">一般參考值</text><text x="92" y="318" text-anchor="middle" class="num" style="fill:#c4801d">約 7</text><text x="92" y="329" text-anchor="middle" class="xs">結晶飽和點約 6.8</text>
<rect x="158" y="274" width="112" height="60" rx="10" fill="#edf5ff" /><text x="214" y="291" text-anchor="middle" class="b">已有痛風</text><text x="214" y="318" text-anchor="middle" class="num" style="fill:#3474ba">＜6</text><text x="214" y="329" text-anchor="middle" class="xs">治療到目標並維持</text>
<rect x="280" y="274" width="112" height="60" rx="10" fill="#f4edff" /><text x="336" y="291" text-anchor="middle" class="b">痛風石／嚴重痛風</text><text x="336" y="318" text-anchor="middle" class="num" style="fill:#7958a7">＜5</text><text x="336" y="329" text-anchor="middle" class="xs">或達標仍頻繁發作</text>
<rect x="402" y="274" width="121" height="60" rx="10" fill="#ecf8f2" /><text x="462" y="291" text-anchor="middle" class="b">腎病／心臟病＋痛風</text><text x="462" y="318" text-anchor="middle" class="num" style="fill:#26816c">通常＜6</text><text x="462" y="329" text-anchor="middle" class="xs">沒有證據需一律更低</text>
<rect x="36" y="346" width="487" height="65" rx="10" fill="#fff0ed" />
<text x="49" y="363" class="b" style="fill:#a5423d">只有高尿酸、沒有痛風時</text><text x="49" y="379" class="s">慢性腎病、心血管疾病或心衰竭，目前沒有公認「為保護器官而必須達到」的尿酸目標；</text><text x="49" y="394" class="s">只有尿酸高、從沒發作過的人，目前沒有證據支持「為了護腎或護心」而吃降尿酸藥。是否治療需個別評估。</text>
<text x="36" y="419" class="xs">※ 各實驗室參考值可能依性別與方法不同；診斷與治療應看症狀、發作史、痛風石、腎功能與結石。</text>
<!-- 部位 -->
<rect x="20" y="440" width="253" height="126" rx="14" fill="#fff" stroke="#e4d9d4" filter="url(#sh)" />
<text x="36" y="464" class="h">痛風常發作在哪裡？</text>
<g transform="translate(35 476)"><path d="M26 5q-8 18-5 38l-12 12q-7 8 2 15q7 6 17-1l14-12q8-7 1-19L35 24q-3-8-9-19z" fill="#ffd3b2" stroke="#9b6a54" stroke-width="2" /><circle cx="12" cy="59" r="8" fill="#ed4f51" /><path d="M2 53l-6-4M3 65l-7 4M11 47v-7" stroke="#df3b42" stroke-width="2" class="line" /></g>
<text x="91" y="487" class="b">最典型：大腳趾根部</text><text x="91" y="504" class="s">也常見腳踝、腳背、膝蓋</text><text x="91" y="524" class="b">其他部位</text><text x="91" y="541" class="s">手腕、手指、手肘；耳朵可見痛風石</text><text x="36" y="558" class="xs">突然夜間劇痛、紅腫發熱，合併發燒時也要排除感染性關節炎。</text>
<!-- 飲食 -->
<rect x="287" y="440" width="252" height="231" rx="14" fill="#fff" stroke="#d9e7df" filter="url(#sh)" />
<text x="303" y="464" class="h">飲食怎麼選？</text>
<g transform="translate(304 467)"><circle cx="12" cy="12" r="12" fill="#ffe1dc" /><path d="M7 7l10 10M17 7L7 17" stroke="#c94e49" stroke-width="2.5" class="line" /><text style="font-size:8.6px;font-weight:700" x="31" y="9" class="b">避免／盡量少</text><text style="font-size:7.35px" x="31" y="24" class="s">內臟、濃肉湯／火鍋湯、啤酒與烈酒、</text><text style="font-size:7.35px" x="31" y="38" class="s">含糖飲料／果糖飲品</text></g>
<g transform="translate(304 515)"><circle cx="12" cy="12" r="12" fill="#fff0cf" /><path d="M5 12h14M12 5v14" stroke="#c78d28" stroke-width="2.2" /><text style="font-size:8.3px" x="31" y="9" class="b">控制份量</text><text style="font-size:7.35px" x="31" y="24" class="s">紅肉、部分海鮮：沙丁魚、鯷魚、貝類、</text><text style="font-size:7.35px" x="31" y="38" class="s">蝦蟹；避免暴飲暴食與快速減重</text></g>
<g transform="translate(304 563)"><circle cx="12" cy="12" r="12" fill="#dff2e7" /><path d="M5 13l5 4 9-11" fill="none" stroke="#33855f" stroke-width="2.5" class="line" /><text style="font-size:8.6px;font-weight:700" x="31" y="9" class="b">可以多選</text><text style="font-size:7.35px" x="31" y="24" class="s">低脂乳品、蔬菜、全穀、蛋、豆類與適量</text><text style="font-size:7.35px" x="31" y="38" class="s">植物蛋白；蔬菜中的普林通常不必過度限制</text></g>
<g transform="translate(304 611)"><circle cx="12" cy="12" r="12" fill="#e5f2ff" /><path d="M8 5h8l2 15H6z" fill="#70b7dc" /><text style="font-size:8.6px;font-weight:700" x="31" y="9" class="b">水分依醫囑</text><text style="font-size:7.35px" x="31" y="24" class="s">無限水者足量喝水；心衰竭或腎病需限水者，</text><text style="font-size:7.35px" x="31" y="38" class="s">不可自行大量飲水</text></g>
<text style="font-size:6.6px;font-weight:700;fill:#9a5a00;paint-order:stroke;stroke:#fff0a8;stroke-width:4px;stroke-linejoin:round" x="303" y="663" class="xs">飲食可幫忙，但通常不能取代規律降尿酸藥。</text>
<!-- 藥物提醒 -->
<rect x="20" y="581" width="253" height="160" rx="14" fill="#fff7e3" stroke="#edca73" filter="url(#sh)" />
<text x="36" y="603" class="h">藥物怎麼用？</text>
<text x="36" y="621" class="b" style="font-size:8.6px;font-weight:700">發作時：消炎止痛</text><text x="36" y="634" class="s" style="font-size:7.35px">秋水仙素、消炎止痛藥或類固醇，由醫師依腎功能、</text><text x="36" y="645" class="s" style="font-size:7.35px">胃病、抗凝血劑與心衰竭狀況選擇；勿自行混用。</text>
<text x="36" y="663" class="b" style="font-size:8.6px;font-weight:700">平常：降尿酸藥預防下一次</text><text x="36" y="676" class="s" style="font-size:7.35px">Allopurinol 是第一線，腎功能不好也可用；低劑量</text><text x="36" y="687" class="s" style="font-size:7.35px">開始，依尿酸逐步調整到目標。</text><text x="36" y="698" class="s" style="font-size:7.35px">剛開始反而容易發作，醫師常同時開 3～6 個月的</text><text x="36" y="709" class="s" style="font-size:7.35px">預防性抗發炎藥 —— 這是正常的，別因此停藥。</text>
<text x="36" y="726" class="xs" style="font-size:5.8px;font-weight:700;fill:#b42318;paint-order:stroke;stroke:#ffe39a;stroke-width:4px;stroke-linejoin:round">華人使用 Allopurinol 前常需評估 HLA-B*58:01；若起疹、嘴破、發燒立即停藥就醫。</text>
<!-- footer reminders -->
<rect x="20" y="751" width="519" height="22" rx="8" fill="#a64242" /><text x="279" y="766" text-anchor="middle" style="font:700 8.5px 'Microsoft JhengHei',sans-serif;fill:white">關節紅腫劇痛合併發燒、無法走路或全身不適：儘快就醫；勿自行停慢性藥物。</text>
<text x="20" y="781" class="xs">來源：ACR 2020 痛風指引；NICE NG219；EULAR 痛風建議；KDIGO 2024 CKD 指引；台灣心臟學會 2024 ASCVD 初級預防指引。供衛教，不取代診療。</text><text x="20" y="791" class="xs" style="font-weight:700">© 2026 林祐賸醫師 編製　本單張僅供臨床衛教使用，未經同意請勿重製、改作或作商業用途。</text>
