<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 559 794">
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>心房顫動｜心律不整電燒手術｜A5 病人衛教單張</dc:title><dc:creator>林祐賸醫師</dc:creator><dc:rights>© 2026 林祐賸醫師 編製。本單張僅供臨床衛教使用，未經同意不得重製、改作或作商業用途。</dc:rights><dc:source>https://dissertlin.github.io/health-education/af/</dc:source></rdf:Description></rdf:RDF></metadata>
<defs><style>.t{font:700 21px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:white}.st{font:600 10px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#e9fbff}.h{font:700 15px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#18334d}.hh{font:700 12px 'Microsoft JhengHei','Noto Sans TC',sans-serif}.b{font:700 10.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#263a4d}.s{font:500 8.7px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#4b5e70}.xs{font:500 6.6px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#617181}.num{font:700 20px 'Microsoft JhengHei','Noto Sans TC',sans-serif}.ib{font:700 9.6px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#263a4d}.iv{font:700 10px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#c96a1e}.line{stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#d9e5ea;stroke-width:1.2}</style><linearGradient id="g" x1="0" x2="1"><stop stop-color="#176d8e"/><stop offset="1" stop-color="#15a99d"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#18334d" flood-opacity=".11"/></filter></defs>
<rect width="559" height="794" fill="#f4f9fa"/>
<!-- 標題 -->
<rect x="18" y="15" width="523" height="84" rx="16" fill="url(#g)"/><path d="M29 58h22l7-20 10 35 11-24 8 9h25" fill="none" stroke="#7ce2db" stroke-width="6" opacity=".5" class="line"/><text x="42" y="46" class="t">心房顫動｜心律不整電燒手術</text><text x="42" y="69" class="st">導管隔離肺靜脈異常電訊號，減少發作並維持正常竇性心律</text><text x="42" y="87" class="st">適合對象、預期成功率與風險，需由心臟電生理醫師個別評估</text>
<!-- 為何恢復正常 -->
<rect x="20" y="110" width="519" height="91" rx="13" class="card" filter="url(#sh)"/><text x="36" y="133" class="h">為什麼希望心律恢復正常？</text>
<g transform="translate(37 144)"><path d="M18 6C9-4-5 3-2 17c2 10 20 21 20 21s18-11 20-21C41 3 27-4 18 6z" fill="#ef6c76"/><path d="M-1 21h8l3-7 6 15 5-11 4 3h14" fill="none" stroke="#fff" stroke-width="2" class="line"/><text x="48" y="10" class="b">少心悸、喘與疲倦</text><text x="48" y="25" class="s">降低心房顫動負荷，改善活動能力與生活品質</text></g>
<g transform="translate(273 144)"><circle cx="18" cy="17" r="16" fill="#e8f6f2"/><path d="M7 18h6l4-9 6 18 4-9h7" fill="none" stroke="#13998e" stroke-width="2.5" class="line"/><text x="44" y="10" class="b">部分病人可保護心臟功能</text><text x="44" y="25" class="s">早期節律控制在特定高風險族群有益</text></g>
<rect x="36" y="179" width="487" height="14" rx="7" fill="#eef6ff"/><text x="279" y="189" text-anchor="middle" class="xs" style="font-weight:700;fill:#22599a">EAST-AFNET 4：早期節律控制使複合心血管事件風險降低 21%；策略包含藥物、心律轉換與電燒</text>
<!-- 適合與復發 -->
<rect x="20" y="213" width="253" height="184" rx="14" fill="#eef9f6" stroke="#ace5da" filter="url(#sh)"/><text x="36" y="237" class="h" style="fill:#08766d">哪些病人較適合評估電燒？</text>
<g transform="translate(37 249)"><circle cx="10" cy="10" r="10" fill="#cfeee7"/><path d="M5 11l3 3 7-8" fill="none" stroke="#138d81" stroke-width="2.3" class="line"/><text x="27" y="8" class="b">有症狀的陣發性心房顫動</text><text x="27" y="22" class="s">心悸、喘、疲倦影響生活；可作第一線選項</text></g>
<g transform="translate(37 283)"><circle cx="10" cy="10" r="10" fill="#cfeee7"/><path d="M5 11l3 3 7-8" fill="none" stroke="#138d81" stroke-width="2.3" class="line"/><text x="27" y="8" class="b">藥物效果差、副作用或不想長期服藥</text><text x="27" y="22" class="s">症狀持續或反覆復發者</text></g>
<g transform="translate(37 317)"><circle cx="10" cy="10" r="10" fill="#cfeee7"/><path d="M5 11l3 3 7-8" fill="none" stroke="#138d81" stroke-width="2.3" class="line"/><text x="27" y="8" class="b">心房顫動可能造成心臟衰弱</text><text x="27" y="22" class="s">部分心衰竭／心搏過速心肌病者可能受益</text></g>
<g transform="translate(37 351)"><circle cx="10" cy="10" r="10" fill="#cfeee7"/><path d="M5 11l3 3 7-8" fill="none" stroke="#138d81" stroke-width="2.3" class="line"/><text x="27" y="8" class="b">病程較短、心房較小、願意共同決策</text><text x="27" y="22" class="s">通常較可能維持正常心律；仍需個別評估</text></g>

<rect x="287" y="213" width="252" height="184" rx="14" fill="#fff6ed" stroke="#efcf9a" filter="url(#sh)"/><text x="303" y="236" class="h" style="fill:#a65a18">哪些因素讓復發機會增加？</text><text x="303" y="249" class="xs">和沒有該因子者相比；約值來自統合分析</text>
<g transform="translate(303 252)"><rect width="68" height="50" rx="9" fill="#fff" stroke="#f0d6b0"/><circle cx="34" cy="15" r="12.5" fill="#ffe0c3"/><rect x="25" y="16" width="12" height="4.5" rx="1.2" fill="#d47729"/><rect x="37" y="16" width="5" height="4.5" rx="1.2" fill="#eaa969"/><path d="M29 12c3-2 0-4.5 2.5-6.5" fill="none" stroke="#d47729" stroke-width="1.6" class="line"/><text x="34" y="35" text-anchor="middle" class="ib">吸菸</text><text x="34" y="46" text-anchor="middle" class="iv">約 2.2 倍</text></g>
<g transform="translate(379 252)"><rect width="68" height="50" rx="9" fill="#fff" stroke="#f0d6b0"/><circle cx="34" cy="15" r="12.5" fill="#ffe0c3"/><path d="M34 5c4.5 5.5 6.5 8 6.5 10.5a6.5 6.5 0 0 1-13 0C27.5 13 29.5 10.5 34 5z" fill="#d47729"/><path d="M31.5 15.5h5M34 13v5" stroke="#fff" stroke-width="1.5" class="line"/><text x="34" y="35" text-anchor="middle" class="ib">糖尿病</text><text x="34" y="46" text-anchor="middle" class="iv">約 2.0 倍</text></g>
<g transform="translate(455 252)"><rect width="68" height="50" rx="9" fill="#fff" stroke="#f0d6b0"/><circle cx="34" cy="15" r="12.5" fill="#ffe0c3"/><path d="M35.5 5.4c-6.4 0-11.5 4.3-11.5 9.6s5.1 9.6 11.5 9.6c3.7 0 6-2 6-4.4 0-3.2-5.6-3.4-5.6-6.6 0-3.2 5.6-3.4 5.6-6.6 0-2.4-2.3-4.6-6-4.6z" fill="#d47729"/><text x="34" y="35" text-anchor="middle" class="ib">腎臟病</text><text x="34" y="46" text-anchor="middle" class="iv">約 2.3 倍</text></g>
<g transform="translate(303 306)"><rect width="68" height="50" rx="9" fill="#fff" stroke="#f0d6b0"/><circle cx="34" cy="15" r="12.5" fill="#ffe0c3"/><path d="M22 16h3.5l2.5-7 3 13 3-10 2.5 6 2-4h5.5" fill="none" stroke="#d47729" stroke-width="2.2" class="line"/><text x="34" y="35" text-anchor="middle" class="ib" style="font-size:8.4px">持續性心房顫動</text><text x="34" y="46" text-anchor="middle" class="iv">約 1.6 倍</text></g>
<g transform="translate(379 306)"><rect width="144" height="50" rx="9" fill="#fff" stroke="#f0d6b0"/><circle cx="26" cy="25" r="12.5" fill="#ffe0c3"/><path d="M17.5 28a8.5 8.5 0 0 1 17 0" fill="none" stroke="#d47729" stroke-width="2.2" class="line"/><path d="M26 28l5.5-6.5" fill="none" stroke="#d47729" stroke-width="2.2" class="line"/><path d="M15 30.5h22" fill="none" stroke="#d47729" stroke-width="2.2" class="line"/><text x="48" y="16" class="ib">肥胖</text><text x="48" y="28" class="xs">BMI 每增加 5 kg/m²</text><text x="48" y="43" class="iv">風險約 +15%</text></g>
<text x="303" y="366" class="s">其他：睡眠呼吸中止、高血壓、飲酒、代謝症候群、</text><text x="303" y="377" class="s">左心房擴大、收縮功能較差、病程較久、牙周病等。</text><text x="303" y="386" class="xs">BMI＝體重(公斤)÷身高(公尺)²；台灣 ≥24 過重、≥27 肥胖</text><text x="303" y="394" class="xs">各項風險來自不同研究，不可直接相加。</text>
<!-- 統合成功率與藥物差異 -->
<rect x="20" y="410" width="519" height="126" rx="14" class="card" filter="url(#sh)"/><text x="36" y="433" class="h">電燒 vs 藥物：合併各種導管消融的統合分析</text><text x="36" y="448" class="xs">18 項隨機試驗、3,725 人；射頻與冷凍等導管消融 vs 抗心律不整藥；中位追蹤約 12 個月</text>
<rect x="36" y="458" width="231" height="56" rx="10" fill="#edf5ff"/><rect x="292" y="458" width="231" height="56" rx="10" fill="#eefaf7"/>
<text x="50" y="475" class="hh" style="fill:#174e99">導管電燒：處理異常電訊號</text><text x="50" y="502" class="s">估計 1 年無復發</text><text x="128" y="505" class="num" style="fill:#2871ce">約 79%</text>
<text x="306" y="475" class="hh" style="fill:#08766d">藥物：抑制異常心律</text><text x="306" y="502" class="s">估計 1 年無復發</text><text x="384" y="505" class="num" style="fill:#15988c">約 59%</text>
<text x="36" y="528" class="xs">統合結果：消融復發風險比藥物低約 49%（RR 0.51，95% CI 0.42–0.63）。估計值非個人保證。</text>
<!-- 技術選擇 -->
<text x="20" y="560" class="h">手術選擇：共同目標都是肺靜脈隔離</text>
<rect x="20" y="573" width="253" height="91" rx="13" fill="#fff8ec" stroke="#efd094"/><g transform="translate(35 585)"><circle cx="16" cy="16" r="15" fill="#ffe8bd"/><path d="M16 5q-7 10 0 20q7-10 0-20z" fill="#ef8f32"/><text x="40" y="10" class="hh" style="fill:#a55b14">傳統熱能：射頻／冷凍</text><text x="40" y="27" class="s">臨床經驗久、長期資料多，可靈活處理</text></g><text x="36" y="634" class="s">需防範食道、膈神經等鄰近組織的熱傷害。</text><text x="36" y="650" class="xs">仍有血管傷害、心包填塞、中風等少見共同風險。</text>
<rect x="287" y="573" width="252" height="91" rx="13" fill="#eef9ff" stroke="#b4dbed"/><g transform="translate(302 585)"><circle cx="16" cy="16" r="15" fill="#dff3fb"/><path d="M16 3L8 18h8l-4 12 13-18h-8l4-9" fill="none" stroke="#258bae" stroke-width="2.7" class="line"/><text x="40" y="10" class="hh" style="fill:#176b8b">脈衝場消融 PFA</text><text x="40" y="27" class="s">非熱能、通常較快，較少熱傷害鄰近組織</text></g><text x="303" y="634" class="s">長期資料較短，仍有導管手術共同風險。</text><text x="303" y="650" class="xs">直接藥物對照不足，未納入上方合併成功率。</text>
<!-- 併發症及提醒 -->
<rect x="20" y="678" width="519" height="50" rx="11" fill="#fff0ed" stroke="#efaaa5"/><text x="36" y="696" class="b" style="fill:#9d3d37">大型研究平均：整體併發症 4.5%｜嚴重 2.4%｜血管 1.3%｜心包積液／填塞 0.8%｜中風/TIA 0.2%</text><text x="36" y="713" class="s" style="fill:#9d3d37">仍可能復發或需再次手術。手術成功不等於可停抗凝血劑；是否停藥依中風風險評估。</text><text x="36" y="723" class="xs">實際風險依年齡、共病、心房顫動類型、手術方式及醫院經驗而不同。</text>
<!-- sources -->
<rect x="20" y="739" width="519" height="49" rx="7" fill="#223149"/><text x="29" y="750" style="font:700 6.8px 'Microsoft JhengHei',sans-serif;fill:#fff">資料來源（查核至 2026-08）：</text><text x="29" y="759" style="font:500 6.4px 'Microsoft JhengHei',sans-serif;fill:#e5edf5">2024 ESC AF Guideline；2023 ACC/AHA/ACCP/HRS Guideline；EAST-AFNET 4, NEJM 2020；</text><text x="29" y="768" style="font:500 6.4px 'Microsoft JhengHei',sans-serif;fill:#e5edf5">18 RCTs meta-analysis, n=3725, 2026（RR 0.51）；Heart Rhythm 2026 復發因子統合分析；糖尿病、腎病與 BMI 統合分析；</text><text x="29" y="777" style="font:500 6.4px 'Microsoft JhengHei',sans-serif;fill:#e5edf5">2024 AF ablation expert consensus；Europace 2023 併發症分析。本資訊圖供共同決策，不取代個別診療。　© 2026 林祐賸醫師 編製</text>
