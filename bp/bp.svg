<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 559 794">
<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>血壓控制｜生活大小事｜A5 病人衛教單張</dc:title><dc:creator>林祐賸醫師</dc:creator><dc:rights>© 2026 林祐賸醫師 編製。本單張僅供臨床衛教使用，未經同意不得重製、改作或作商業用途。</dc:rights><dc:source>https://dissertlin.github.io/health-education/bp/</dc:source></rdf:Description></rdf:RDF></metadata>
<defs><style>.t{font:700 24px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:white}.st{font:600 11px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#eaf8ff}.h{font:700 15px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#193650}.b{font:700 10.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#293c50}.s{font:500 8.8px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#4c5f72}.xs{font:500 6.8px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#667788}.num{font:700 20px 'Microsoft JhengHei','Noto Sans TC',sans-serif}.line{stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dae6eb;stroke-width:1.3}</style><linearGradient id="g" x1="0" x2="1"><stop stop-color="#2473a6"/><stop offset="1" stop-color="#23a69d"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#193650" flood-opacity=".12"/></filter></defs>
<rect width="559" height="794" fill="#f4f9fa"/>
<!-- 標題 -->
<rect x="18" y="16" width="523" height="91" rx="16" fill="url(#g)"/><g transform="translate(32 27)"><circle cx="27" cy="27" r="24" fill="#dff5f3"/><path d="M13 30h8l4-12 8 24 6-14 5 2h9" fill="none" stroke="#e85864" stroke-width="3" class="line"/><circle cx="27" cy="27" r="19" fill="none" stroke="#2473a6" stroke-width="2"/></g><text x="101" y="49" class="t">血壓控制｜生活大小事</text><text x="101" y="73" class="st">量得準、記得清、按時服藥，保護心臟、大腦與腎臟</text><text x="101" y="93" class="st">高血壓常沒有症狀，不能只靠「感覺」判斷</text>
<!-- 高血壓定義 -->
<rect x="20" y="120" width="519" height="105" rx="14" class="card" filter="url(#sh)"/><text x="36" y="145" class="h">什麼是高血壓？</text><g transform="translate(37 158)"><path d="M18 5C9-5-5 3-2 17c2 10 20 21 20 21s18-11 20-21C41 3 27-5 18 5z" fill="#ef6c76"/><path d="M-1 21h8l3-7 6 15 5-11 4 3h14" fill="none" stroke="#fff" stroke-width="2" class="line"/><text x="48" y="9" class="b">血液長期對血管壁的壓力太高</text><text x="48" y="25" class="s">久了會增加腦中風、心臟病、心衰竭、腎病與視網膜傷害風險。</text></g><rect x="36" y="198" width="231" height="19" rx="9" fill="#eaf3ff"/><text x="151" y="212" text-anchor="middle" class="s" style="font-weight:700;fill:#235d9b">居家平均 ≥130/80：符合高血壓門檻</text><rect x="287" y="198" width="236" height="19" rx="9" fill="#fff0ed"/><text x="405" y="212" text-anchor="middle" class="s" style="font-weight:700;fill:#aa4139">單次偏高不等於確診，要看多日平均</text>
<!-- 722 -->
<text x="20" y="251" class="h">怎樣量才正確？記住居家「722」</text><rect x="20" y="264" width="519" height="174" rx="14" class="card" filter="url(#sh)"/>
<g transform="translate(36 277)"><rect width="151" height="42" rx="9" fill="#f3f7fd"/><circle cx="22" cy="21" r="16" fill="#dcecff"/><text x="22" y="27" text-anchor="middle" style="font:700 17px 'Microsoft JhengHei';fill:#3477c5">7</text><text x="46" y="16" class="b">連續量 7 天</text><text x="46" y="31" class="s">記錄每天數值與趨勢</text></g>
<g transform="translate(204 277)"><rect width="151" height="42" rx="9" fill="#f0faf7"/><circle cx="22" cy="21" r="16" fill="#d9f1eb"/><text x="22" y="27" text-anchor="middle" style="font:700 17px 'Microsoft JhengHei';fill:#15968b">2</text><text x="46" y="16" class="b">每天早、晚各量</text><text x="46" y="31" class="s">盡量固定相同時間</text></g>
<g transform="translate(372 277)"><rect width="151" height="42" rx="9" fill="#fff9ed"/><circle cx="22" cy="21" r="16" fill="#ffedc7"/><text x="22" y="27" text-anchor="middle" style="font:700 17px 'Microsoft JhengHei';fill:#c88a23">2</text><text x="46" y="16" class="b">每次量 2 遍</text><text x="46" y="31" class="s">間隔 1 分鐘，都要記錄</text></g>
<!-- 姿勢 -->
<g transform="translate(37 333)"><circle cx="22" cy="12" r="10" fill="#ffd7b5"/><path d="M14 9q8-13 16 0" fill="#506f89"/><path d="M22 23v33M22 37L6 44M22 37l19 2M22 56L9 70M22 56l15 14" fill="none" stroke="#5c9caf" stroke-width="6" class="line"/><path d="M3 42h43M4 70h38" stroke="#82949e" stroke-width="3" class="line"/><rect x="42" y="30" width="26" height="15" rx="5" fill="#75b6d0"/><path d="M68 37h20" stroke="#5a7484" stroke-width="3"/><text x="99" y="11" class="b">量之前</text><text x="99" y="27" class="s">30 分鐘內不抽菸、不喝咖啡／茶、不運動；先排尿，安靜坐 5 分鐘。</text><text x="99" y="48" class="b">量的時候</text><text x="99" y="64" class="s">用合適袖帶的上臂式血壓計；背靠椅、腳平放不交叉、手臂與心臟同高，</text><text x="99" y="79" class="s">袖帶貼裸露皮膚；不說話、不滑手機。</text></g>
<!-- 目標 -->
<rect x="20" y="454" width="253" height="208" rx="14" fill="#edf5ff" stroke="#b8d4f1" filter="url(#sh)"/><text x="36" y="479" class="h" style="fill:#245e98">血壓控制標準</text><text x="36" y="500" class="b">台灣居家一般目標</text><text x="36" y="526" class="num" style="fill:#2871c8">＜130/80</text><text x="137" y="524" class="s">mmHg</text><text x="36" y="548" class="s">已在治療、身體能耐受的人可以再低一點：</text><text x="36" y="564" class="b">ESC 120–129／AHA 收縮壓＜120</text><rect x="35" y="576" width="223" height="55" rx="9" fill="#fff"/><text x="47" y="592" class="b">不是越低越好</text><text x="47" y="608" class="s">頭暈、跌倒、虛弱或姿態性低血壓者，</text><text x="47" y="622" class="s">以及高齡衰弱、嚴重腎病者需個別調整。</text><text x="36" y="650" class="xs">「算不算高血壓」「要不要吃藥」「吃藥後要降到多少」是三件事。</text>
<!-- 日常 -->
<rect x="287" y="454" width="252" height="208" rx="14" fill="#eef9f5" stroke="#afe5d9" filter="url(#sh)"/><text x="303" y="479" class="h" style="fill:#087a70">平常這樣做</text><g transform="translate(304 494)"><circle cx="12" cy="12" r="12" fill="#cfeee7"/><path d="M5 14l5 4 8-11" fill="none" stroke="#168f82" stroke-width="2.5" class="line"/><text x="31" y="9" class="b">少鹽、多原型食物</text><text x="31" y="24" class="s">每天鹽不超過 1 茶匙；湯、醬料、沾醬都藏鹽</text></g><g transform="translate(304 530)"><circle cx="12" cy="12" r="12" fill="#cfeee7"/><path d="M6 17l5-9 5 6 4-8" fill="none" stroke="#168f82" stroke-width="2.5" class="line"/><text x="31" y="9" class="b">規律活動與體重管理</text><text x="31" y="24" class="s">每週至少 150 分鐘中等強度；量力而為</text></g><g transform="translate(304 566)"><circle cx="12" cy="12" r="12" fill="#cfeee7"/><path d="M7 6h10v13H7zM5 19h14" fill="none" stroke="#168f82" stroke-width="2"/><text x="31" y="9" class="b">不抽菸、酒精越少越好</text><text x="31" y="24" class="s">睡眠充足；有打鼾／呼吸中止要評估</text></g><g transform="translate(304 602)"><circle cx="12" cy="12" r="12" fill="#cfeee7"/><rect x="5" y="8" width="14" height="9" rx="5" fill="#17988c"/><path d="M12 8v9" stroke="#fff"/><text x="31" y="9" class="b">每天按時服藥</text><text x="31" y="24" class="s">勿因血壓正常自行停藥；回診帶血壓紀錄</text></g><text x="303" y="650" class="xs">感冒藥、止痛藥、草藥與保健品可能影響血壓，先詢問。</text>
<!-- 醫師提醒 -->
<rect x="20" y="677" width="519" height="68" rx="12" fill="#fff7e3" stroke="#efca70"/><text x="36" y="699" class="h">和醫師一起決定你的目標</text><text x="36" y="723" class="b">我的居家血壓目標：_______／_______ mmHg</text><text x="311" y="723" class="s">起身會頭暈、虛弱或跌倒？帶血壓紀錄回診討論。</text>
<!-- emergency + sources -->
<rect x="20" y="754" width="519" height="18" rx="7" fill="#fff0ed"/><text x="279" y="767" text-anchor="middle" class="xs" style="font-weight:700;fill:#a33d37">重測仍 ≥180/120 且胸痛、喘、無力、視力或說話異常：立即打 119；勿自行加藥。</text><text x="20" y="781" class="xs">來源：2022 台灣高血壓指引（722、≥130/80、目標＜130/80）；2024 ESC 高血壓指引；2025 AHA/ACC 高血壓指引與居家量測說明。供衛教，不取代診療。</text><text x="20" y="791" class="xs" style="font-weight:700">© 2026 林祐賸醫師 編製　本單張僅供臨床衛教使用，未經同意請勿重製、改作或作商業用途。</text>
