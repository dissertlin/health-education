1 起身前先熱身
躺著或坐著先動腳踝、
握拳、繃緊大腿各 10 下
2 分段慢慢起來
躺 → 坐 1–2 分鐘 →
扶著東西再站起來
3 覺得暈就夾緊
雙腿交叉用力夾緊，
或立刻蹲下、坐下
