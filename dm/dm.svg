<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>認識第二型糖尿病｜A5 病人衛教單張</dc:title><dc:creator>林祐賸醫師</dc:creator><dc:rights>© 2026 林祐賸醫師 編製。本單張僅供臨床衛教使用，未經同意不得重製、改作或作商業用途。</dc:rights><dc:source>https://dissertlin.github.io/health-education/dm/</dc:source></rdf:Description></rdf:RDF></metadata>
<defs><style>
.t{font:700 22px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#fff}
.st{font:600 10.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#dce9f5}
.h{font:700 14.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#12324e}
.b{font:700 10.2px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#1c3f5e}
.s{font:500 8.7px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#4e6173}
.xs{font:500 7.2px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#6a7c8c}
.src{font:500 6.4px 'Microsoft JhengHei',sans-serif;fill:#dfe9f2}
.th{font:700 8.6px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#12324e}
.card{fill:#fff;stroke:#d8e3ec;stroke-width:1.3}
.line{stroke-linecap:round;stroke-linejoin:round}
</style>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#14427a"/><stop offset="1" stop-color="#1f7aa8"/></linearGradient>
<filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#12324e" flood-opacity=".12"/></filter></defs>
<rect width="559" height="794" fill="#f6fafd"/>
<rect x="18" y="14" width="523" height="93" rx="16" fill="url(#g)"/>
<g transform="translate(36 30)">
<circle cx="28" cy="28" r="24" fill="none" stroke="#7fc4e8" stroke-width="7"/>
<circle cx="28" cy="28" r="10" fill="#bde3f5"/>
</g>
<text x="112" y="46" class="t">認識糖尿病</text>
<text x="238" y="46" class="st">第二型</text>
<text x="112" y="68" class="st">控制好血糖，是為了保護眼睛、腎臟、神經與心血管</text>
<rect x="112" y="79" width="330" height="19" rx="9.5" fill="#fff"/>
<text x="124" y="92" class="s">目標<tspan style="font-weight:700;fill:#1a5a96">因人而異</tspan>；請以醫師為您設定的數字為準</text>
<rect x="20" y="118" width="519" height="132" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="140" class="h">我的糖化血色素（HbA1c）目標是多少？</text>
<text x="312" y="141" class="s" style="fill:#1a5a96">與醫師討論後的目標</text><rect x="398" y="125" width="92" height="21" rx="5" fill="#f7fbfe" stroke="#9cc0dc" stroke-width="1.1" stroke-dasharray="3.2 2.2"/><text x="496" y="141" class="b" style="fill:#1a5a96">%</text>
<rect x="36" y="148" width="487" height="18" rx="5" fill="#eaf3fa"/>
<text x="46" y="161" class="th">您的情況</text><text x="330" y="161" class="th">HbA1c 目標</text><text x="424" y="161" class="th">為什麼</text>
<text x="46" y="178" class="s">一般成年人</text><text x="330" y="178" class="s" style="font-weight:700;fill:#1a5a96">&lt; 7%</text><text x="424" y="178" class="xs">兼顧併發症預防與低血糖風險</text>
<line x1="36" y1="183" x2="523" y2="183" stroke="#eef4f9"/>
<text x="46" y="194" class="s">年輕、病程短、沒有併發症</text><text x="330" y="194" class="s" style="font-weight:700;fill:#1a5a96">可更嚴格 &lt; 6.5%</text><text x="424" y="194" class="xs">越早控制好，長期保護越明顯</text>
<line x1="36" y1="199" x2="523" y2="199" stroke="#eef4f9"/>
<text x="46" y="210" class="s">健康、功能良好的長者</text><text x="330" y="210" class="s" style="font-weight:700;fill:#1a5a96">&lt; 7.5%</text><text x="424" y="210" class="xs">稍微放寬，避免低血糖</text>
<line x1="36" y1="215" x2="523" y2="215" stroke="#eef4f9"/>
<text x="46" y="226" class="s">共病多、曾有低血糖、預期餘命有限</text><text x="330" y="226" class="s" style="font-weight:700;fill:#1a5a96">放寬，約 8%</text><text x="424" y="226" class="xs">避免低血糖比追數字更重要</text>
<rect x="36" y="232" width="487" height="16" rx="7" fill="#fdf0ee"/>
<text x="48" y="243" class="xs" style="fill:#b5382b"><tspan style="font-weight:700">注意：</tspan>貧血、地中海型貧血帶原、慢性腎病、洗腎或近期輸血時，HbA1c 可能失真，需搭配其他指標判讀。</text>
<rect x="20" y="258" width="519" height="94" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="280" class="h">要怎麼吃？</text>
<text x="115" y="280" class="xs">沒有「糖尿病專用食物」，重點是<tspan style="font-weight:700">總量、種類與時間</tspan></text>
<g transform="translate(48 286)"><path d="M12 3c2.6 3 2.6 6 0 9-2.6-3-2.6-6 0-9z" fill="none" stroke="#1a5a96" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 11c2.6 3 2.6 6 0 9-2.6-3-2.6-6 0-9z" fill="none" stroke="#1a5a96" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 13v9M5 22h14" stroke="#1a5a96" stroke-width="1.6" stroke-linecap="round"/></g>
<text x="60" y="320" class="xs" text-anchor="middle" style="font-weight:700;fill:#1a5a96">全穀根莖</text>
<text x="60" y="330" class="xs" text-anchor="middle" style="fill:#1a5a96">定量不過量</text>
<g transform="translate(132 286)"><path d="M12 22c-5 0-8.5-3.6-8.5-8.4 0-3.6 2.6-6.8 5.8-7.8 1-.4 2 0 2.6 1 .6-1 1.6-1.4 2.6-1 3.2 1 5.5 4.2 5.5 7.8 0 4.8-3.4 8.4-8 8.4z" fill="none" stroke="#2e7d5b" stroke-width="1.8"/><path d="M12 5.5c0-2 1.6-3.5 3.6-3.5 0 2-1.6 3.5-3.6 3.5z" fill="#2e7d5b"/></g>
<text x="144" y="320" class="xs" text-anchor="middle" style="font-weight:700;fill:#2e7d5b">蔬菜佔一半</text>
<g transform="translate(216 286)"><path d="M3 13c4-5 11-6 16-2 1 1 2 1.5 2 2s-1 1-2 2c-5 4-12 3-16-2z" fill="none" stroke="#2e7d5b" stroke-width="1.7" stroke-linejoin="round"/><circle cx="8" cy="12" r="1.3" fill="#2e7d5b"/><path d="M19 10l3-3v10l-3-3" fill="none" stroke="#2e7d5b" stroke-width="1.7" stroke-linejoin="round"/></g>
<text x="228" y="320" class="xs" text-anchor="middle" style="font-weight:700;fill:#2e7d5b">優質蛋白</text>
<text x="228" y="330" class="xs" text-anchor="middle" style="fill:#2e7d5b">魚、豆、蛋</text>
<g transform="translate(300 286)"><path d="M7 5h10l-1.5 15a2.2 2.2 0 0 1-2.2 2h-2.6a2.2 2.2 0 0 1-2.2-2z" fill="none" stroke="#c0392b" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 10h8" stroke="#c0392b" stroke-width="1.4"/><path d="M11 1.5h2v3.5h-2z" fill="none" stroke="#c0392b" stroke-width="1.4"/><path d="M3 21L21 3" stroke="#c0392b" stroke-width="1.9" stroke-linecap="round"/></g>
<text x="312" y="320" class="xs" text-anchor="middle" style="font-weight:700;fill:#c0392b">戒含糖飲</text>
<text x="312" y="330" class="xs" text-anchor="middle" style="fill:#c0392b">影響最大</text>
<g transform="translate(384 286)"><path d="M3 13h18c0 5-4 8-9 8s-9-3-9-8z" fill="none" stroke="#c0392b" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 10c0-2 2-2 2-4M14 10c0-2 2-2 2-4" stroke="#c0392b" stroke-width="1.4" stroke-linecap="round"/><path d="M3 21L21 3" stroke="#c0392b" stroke-width="1.9" stroke-linecap="round"/></g>
<text x="396" y="320" class="xs" text-anchor="middle" style="font-weight:700;fill:#c0392b">少精製澱粉</text>
<text x="396" y="330" class="xs" text-anchor="middle" style="fill:#c0392b">白飯麵包少量</text>
<g transform="translate(468 286)"><circle cx="12" cy="12" r="9" fill="none" stroke="#1a5a96" stroke-width="1.8"/><path d="M12 6.5V12l4 2.6" stroke="#1a5a96" stroke-width="1.8" stroke-linecap="round"/></g>
<text x="480" y="320" class="xs" text-anchor="middle" style="font-weight:700;fill:#1a5a96">定時定量</text>
<text x="480" y="330" class="xs" text-anchor="middle" style="fill:#1a5a96">不要跳過正餐</text>
<rect x="36" y="330" width="487" height="17" rx="7" fill="#eef6f1"/>
<text x="48" y="342" class="s" style="fill:#2e7d5b"><tspan style="font-weight:700">以上僅為原則。</tspan>實際的份量、菜單與外食方式，<tspan style="font-weight:700">建議由糖尿病衛教師或營養師依您的個別狀況調整</tspan>。</text>
<rect x="20" y="360" width="519" height="102" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="382" class="h">藥物與胰島素</text>
<text x="150" y="382" class="xs">用哪一種、用幾種，依血糖、腎功能、心血管狀況與體重由醫師決定</text>
<rect x="36" y="390" width="240" height="62" rx="9" fill="#eaf3fa"/>
<text x="49" y="405" class="b" style="fill:#1a5a96">常用的口服與針劑</text>
<text x="49" y="419" class="s">Metformin 多為第一線</text>
<text x="49" y="431" class="s">SGLT2 抑制劑、GLP-1 另有心腎保護</text>
<text x="49" y="444" class="s" style="font-weight:700">腎功能不好時，劑量需調整或換藥</text>
<rect x="283" y="390" width="240" height="62" rx="9" fill="#eef6f1"/>
<text x="296" y="405" class="b" style="fill:#2e7d5b">什麼時候會用胰島素</text>
<text x="296" y="418" class="s">初診斷血糖很高、或口服藥已用足仍未達標</text>
<text x="296" y="429" class="s">懷孕、嚴重感染、手術或住院期間</text>
<text x="296" y="440" class="s" style="font-weight:700">肝腎功能不好，許多口服藥受限時</text>
<text x="296" y="450" class="xs">有些是暫時的——不代表病情無救</text>
<rect x="20" y="470" width="519" height="78" rx="13" fill="#fff6e8" stroke="#e8c187" stroke-width="1.7"/>
<text x="37" y="491" class="h" style="fill:#9a6410">低血糖怎麼辦？記住「15–15」</text>
<text x="265" y="491" class="xs" style="fill:#9a6410">冒冷汗、發抖、心悸、飢餓、頭暈、注意力渙散</text>
<text x="37" y="509" class="s"><tspan style="font-weight:700;fill:#9a6410">① 吃 15 公克快速醣類</tspan>　含糖飲料 120～150 mL｜方糖 3 顆｜蜂蜜 1 大匙</text>
<text x="37" y="523" class="s"><tspan style="font-weight:700;fill:#9a6410">② 等 15 分鐘再測</tspan>　沒改善就再吃一次；改善後若離下一餐還久，補充一份點心</text>
<text x="37" y="539" class="s" style="fill:#b5382b"><tspan style="font-weight:700">不要用巧克力、牛奶、蛋糕</tspan>（脂肪延緩吸收）；<tspan style="font-weight:700">意識不清時不可餵食，立即送醫</tspan>。開車前先測血糖。</text>
<rect x="20" y="556" width="519" height="94" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="578" class="h">生活上要注意什麼？</text>
<text x="180" y="578" class="xs">血糖以外，血壓、血脂與戒菸同樣影響併發症</text>
<g transform="translate(48 584)"><circle cx="13" cy="3.6" r="2.6" fill="none" stroke="#2e7d5b" stroke-width="1.7"/><path d="M9 22l3-8 4-2 2 4 4 1" fill="none" stroke="#2e7d5b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 14l-5 4" stroke="#2e7d5b" stroke-width="1.7" stroke-linecap="round"/></g>
<text x="60" y="618" class="xs" text-anchor="middle" style="font-weight:700;fill:#2e7d5b">每週 150 分鐘</text>
<text x="60" y="628" class="xs" text-anchor="middle" style="fill:#2e7d5b">中等強度</text>
<g transform="translate(132 584)"><rect x="5" y="2" width="14" height="20" rx="2.4" fill="none" stroke="#1a5a96" stroke-width="1.7"/><rect x="8" y="5" width="8" height="5" rx="1" fill="none" stroke="#1a5a96" stroke-width="1.4"/><circle cx="9.5" cy="14" r="1.2" fill="#1a5a96"/><circle cx="14.5" cy="14" r="1.2" fill="#1a5a96"/><circle cx="9.5" cy="18" r="1.2" fill="#1a5a96"/><circle cx="14.5" cy="18" r="1.2" fill="#1a5a96"/></g>
<text x="144" y="618" class="xs" text-anchor="middle" style="font-weight:700;fill:#1a5a96">自我監測</text>
<text x="144" y="628" class="xs" text-anchor="middle" style="fill:#1a5a96">並記錄下來</text>
<g transform="translate(216 584)"><path d="M8 3c2.6 0 4.4 2 4.4 5 0 3.4-1.2 5.6-1.2 8.6 0 2.6-1.2 4.4-3.4 4.4S4.4 19.2 4.4 16.6c0-3-1.2-5.2-1.2-8.6C3.2 5 5.4 3 8 3z" fill="none" stroke="#1a5a96" stroke-width="1.6" stroke-linejoin="round"/><circle cx="15" cy="5" r="1.5" fill="#1a5a96"/><circle cx="18.4" cy="7" r="1.4" fill="#1a5a96"/><circle cx="20.6" cy="10" r="1.3" fill="#1a5a96"/></g>
<text x="228" y="618" class="xs" text-anchor="middle" style="font-weight:700;fill:#1a5a96">每天檢查腳</text>
<text x="228" y="628" class="xs" text-anchor="middle" style="fill:#1a5a96">不赤腳、不自剪</text>
<g transform="translate(300 584)"><circle cx="12" cy="12" r="8.6" fill="none" stroke="#1a5a96" stroke-width="1.8"/><path d="M6.5 12H9l1.6-4 2.4 8 1.6-4.6 1 1.6h2.4" fill="none" stroke="#1a5a96" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="312" y="618" class="xs" text-anchor="middle" style="font-weight:700;fill:#1a5a96">血壓 &lt;130/80</text>
<text x="312" y="628" class="xs" text-anchor="middle" style="fill:#1a5a96">LDL 依風險</text>
<g transform="translate(384 584)"><rect x="2" y="12" width="14" height="6" rx="2" fill="none" stroke="#c0392b" stroke-width="1.7"/><path d="M19 12h3v6h-3" fill="none" stroke="#c0392b" stroke-width="1.7"/><path d="M12 9c0-3-4-3-4-6" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round"/><path d="M2 21L21 3" stroke="#c0392b" stroke-width="1.9" stroke-linecap="round"/></g>
<text x="396" y="618" class="xs" text-anchor="middle" style="font-weight:700;fill:#c0392b">戒菸</text>
<text x="396" y="628" class="xs" text-anchor="middle" style="fill:#c0392b">效益最大</text>
<g transform="translate(468 584)"><path d="M9 2h6v2.6l5 4.6v11a1.8 1.8 0 0 1-1.8 1.8H5.8A1.8 1.8 0 0 1 4 20.2v-11l5-4.6z" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12v6M9 15h6" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/></g>
<text x="480" y="618" class="xs" text-anchor="middle" style="font-weight:700;fill:#c0392b">生病時</text>
<text x="480" y="628" class="xs" text-anchor="middle" style="fill:#c0392b">不可自行停藥</text>
<rect x="36" y="632" width="487" height="15" rx="7" fill="#eaf3fa"/>
<text x="48" y="643" class="xs" style="fill:#1a5a96"><tspan style="font-weight:700">定期篩檢：</tspan>眼底、腎功能與尿蛋白、足部、血脂每年一次，牙科每半年，並接種流感與肺炎鏈球菌疫苗<tspan style="font-weight:700">（詳見電子版）</tspan>。</text>
<rect x="20" y="656" width="519" height="88" rx="13" fill="#fdefed" stroke="#eda8a0" stroke-width="1.7"/>
<circle cx="45" cy="680" r="12" fill="#c0392b"/><text x="45" y="685" text-anchor="middle" style="font:700 15px sans-serif;fill:#fff">!</text>
<text x="66" y="676" class="b" style="fill:#b5382b">出現這些情況，提早回診或立即就醫</text>
<text x="66" y="692" class="s" style="fill:#b5382b">反覆低血糖或曾昏迷｜血糖持續過高合併口渴、多尿、體重下降</text>
<text x="66" y="706" class="s" style="fill:#b5382b">想吐、嘔吐、腹痛、呼吸又深又快（可能酮酸中毒）｜腳有傷口、發紅或不癒合</text>
<text x="66" y="720" class="s">視力突然改變｜發燒或感染｜水腫、尿液起泡變多｜準備懷孕或要手術</text>
<text x="66" y="735" class="s" style="font-weight:700;fill:#b5382b">胸痛、嚴重喘、單側無力或意識改變 → 立即撥打 119</text>
<rect x="20" y="750" width="519" height="40" rx="9" fill="#12324e"/>
<text x="31" y="762" class="src">資料來源（查核至 2026-09）：中華民國糖尿病學會《第 2 型糖尿病臨床照護指引》；ADA Standards of Care；</text>
<text x="31" y="773" class="src">2024 中華民國心臟學會 ASCVD 初級預防指引；2025 台灣血脂管理臨床路徑共識。本單張針對第二型糖尿病，供衛教使用，不取代個別診療。</text>
