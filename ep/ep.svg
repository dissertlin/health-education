<rect width="559" height="794" fill="#faf7fc"/>

<!-- 標題 -->
<rect x="18" y="14" width="523" height="93" rx="16" fill="url(#g)"/>
<g transform="translate(34 30)">
<path d="M8 34h9l4-13 6 27 5-19 4 8h10" fill="none" stroke="#f6d6e6" stroke-width="3.4" class="line"/>
<circle cx="14" cy="14" r="5" fill="#f2c14e"/><path d="M14 19v12" stroke="#f2c14e" stroke-width="2.6" class="line"/>
<path d="M46 12l10 6-10 6" fill="none" stroke="#f6d6e6" stroke-width="2.6" class="line"/>
</g>
<text x="106" y="46" class="t">電生理檢查與電燒手術</text>
<text x="106" y="68" class="st">找出心律不整的「起源點」或「迴路」，必要時同次以熱能或冷凍阻斷</text>
<rect x="106" y="79" width="336" height="19" rx="9.5" fill="#fff"/>
<text x="118" y="92" class="s">適用<tspan style="font-weight:700;fill:#8c3a6a">心室上頻脈與心室性心律不整</tspan>；心房顫動另有單張</text>

<!-- ① 這是什麼 -->
<rect x="20" y="118" width="253" height="110" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="140" class="h">① 這是什麼檢查與治療？</text>
<rect x="34" y="148" width="225" height="32" rx="8" fill="#f4eefa"/>
<text x="45" y="161" class="b" style="fill:#6b3f9e">電生理檢查（EPS）</text>
<text x="45" y="174" class="s">放入細導管記錄電訊號，必要時短暫刺激</text>
<rect x="34" y="184" width="225" height="32" rx="8" fill="#fdf0f5"/>
<text x="45" y="197" class="b" style="fill:#a5346a">導管消融（電燒）</text>
<text x="45" y="210" class="s">位置與風險適合時，同次以熱能或冷凍阻斷</text>
<text x="37" y="224" class="xs">不需開胸，但屬侵入性處置</text>

<!-- ② 哪些人需要評估 -->
<rect x="287" y="118" width="252" height="110" rx="13" class="card" filter="url(#sh)"/>
<text x="304" y="140" class="h">② 哪些人可能需要評估？</text>
<text x="304" y="158" class="b">心室上頻脈（SVT）</text>
<text x="304" y="170" class="s">反覆突發心悸、頭暈、昏厥；藥物無效、</text>
<text x="304" y="181" class="s">不耐受或希望根治者可討論電燒</text>
<text x="304" y="196" class="b">心室早期收縮（PVC）</text>
<text x="304" y="208" class="s">症狀明顯、數量頻繁，或疑似影響心功能</text>
<text x="304" y="222" class="b">心室頻脈（VT）<tspan class="s" style="font-weight:500">　ICD 反覆放電、藥物難控</tspan></text>

<!-- ③ 四個步驟 -->
<rect x="20" y="236" width="519" height="116" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="258" class="h">③ 當天怎麼進行？</text>
<text x="160" y="258" class="xs">檢查結果與安全性，決定是否同次電燒</text>
<g>
<circle cx="47" cy="277" r="9" fill="#a13b6e"/><text x="47" y="281" text-anchor="middle" class="num">1</text>
<text x="62" y="274" class="b">準備與麻醉</text>
<text x="62" y="287" class="s">導管室監測心電圖、血壓、血氧；鼠蹊部局部麻醉，是否加鎮靜或全身麻醉依心律型態與院方評估</text>
<circle cx="47" cy="307" r="9" fill="#8c3a7e"/><text x="47" y="311" text-anchor="middle" class="num">2</text>
<text x="62" y="304" class="b">放入導管</text>
<text x="62" y="317" class="s">經靜脈，有時需經動脈或進入左心系統；導管記錄訊號並嘗試誘發。誘發時可能感到心悸，醫護全程監測</text>
<circle cx="47" cy="330" r="9" fill="#7a3f8e"/><text x="47" y="334" text-anchor="middle" class="num">3</text>
<text x="62" y="333" class="b">定位與消融<tspan class="s" style="font-weight:500">　找到病灶且適合治療時，以熱能或冷凍阻斷；複雜心律不整會用三維定位</tspan></text>
<circle cx="47" cy="345" r="9" fill="#6b3f9e"/><text x="47" y="349" text-anchor="middle" class="num">4</text>
<text x="62" y="348" class="b">再測試<tspan class="s" style="font-weight:500">　治療後再確認能否誘發；若無法誘發或風險過高，可能只完成檢查</tspan></text>
</g>

<!-- ④ 三維定位 -->
<rect x="20" y="360" width="519" height="104" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="382" class="h">④ 什麼時候會用到「三維立體定位」？</text>
<text x="310" y="382" class="xs">依心律型態決定，不是每個人都需要</text>
<rect x="36" y="390" width="240" height="62" rx="9" fill="#f4eefa"/>
<text x="49" y="405" class="b" style="fill:#6b3f9e">常需要三維定位的情況</text>
<text x="49" y="418" class="s">心房頻脈、心房撲動（尤其非典型）</text>
<text x="49" y="430" class="s">心室早期收縮、心室頻脈</text>
<text x="49" y="443" class="s">好處：大幅減少 X 光、提高定位精準度</text>
<rect x="283" y="390" width="240" height="62" rx="9" fill="#fdf0f5"/>
<text x="296" y="405" class="b" style="fill:#a5346a">高密度標測導管</text>
<text x="296" y="418" class="s">多電極導管一次採集上萬個點，</text>
<text x="296" y="430" class="s">看得出疤痕邊緣的細小傳導通道</text>
<text x="296" y="443" class="s">用於術後心房頻脈、疤痕相關心室頻脈</text>

<!-- ⑤ 風險 -->
<rect x="20" y="472" width="253" height="102" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="494" class="h">⑤ 風險與限制</text>
<text x="37" y="511" class="b" style="fill:#a5346a">較常見</text>
<text x="37" y="523" class="s">穿刺處疼痛、瘀青、出血或血腫；</text>
<text x="37" y="534" class="s">心悸可能復發，少數需再次治療</text>
<text x="37" y="549" class="b" style="fill:#b23b3b">較少見但重要</text>
<text x="37" y="559" class="s">血管傷害、心包積液、血栓中風、感染；</text>
<text x="37" y="571" class="s" style="fill:#b23b3b">靠近房室結者可能傳導阻滯而需節律器</text>

<!-- ⑥ 術前術後 -->
<rect x="287" y="472" width="252" height="102" rx="13" class="card" filter="url(#sh)"/>
<text x="304" y="494" class="h">⑥ 術前術後重點</text>
<text x="304" y="511" class="s"><tspan style="font-weight:700">術前</tspan>　告知用藥與保健品、過敏、腎功能、</text>
<text x="304" y="522" class="s">懷孕可能、是否裝有節律器／ICD</text>
<text x="304" y="534" class="s" style="font-weight:700;fill:#b23b3b">抗心律不整藥與抗凝血藥一律依醫師指示，切勿自行停</text>
<text x="304" y="549" class="s"><tspan style="font-weight:700">術後</tspan>　依指示平躺、穿刺側髖部不彎；</text>
<text x="304" y="562" class="s">約一週避免提重物、劇烈運動與用力蹲起</text>

<!-- ⑦ 成功率與風險比率 -->
<rect x="20" y="582" width="519" height="86" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="601" class="h">⑦ 大約的成功率與風險</text>
<text x="222" y="601" class="xs">依心律型態與個人狀況而異，請以醫師對「您的」情況評估為準</text>
<text x="36" y="618" class="s">房室結迴旋 AVNRT</text>
<rect x="146" y="612" width="110" height="7" rx="3.5" fill="#efe7f5"/>
<rect x="146" y="612" width="106.1" height="7" rx="3.5" fill="#6b3f9e"/>
<text x="262" y="618" class="s" style="font-weight:700;fill:#6b3f9e">95～98%</text>
<text x="36" y="634" class="s">典型心房撲動</text>
<rect x="146" y="628" width="110" height="7" rx="3.5" fill="#efe7f5"/>
<rect x="146" y="628" width="104.5" height="7" rx="3.5" fill="#6b3f9e"/>
<text x="262" y="634" class="s" style="font-weight:700;fill:#6b3f9e">＞95%</text>
<text x="36" y="650" class="s">旁路迴旋 AVRT</text>
<rect x="146" y="644" width="110" height="7" rx="3.5" fill="#efe7f5"/>
<rect x="146" y="644" width="101.8" height="7" rx="3.5" fill="#6b3f9e"/>
<text x="262" y="650" class="s" style="font-weight:700;fill:#6b3f9e">90～95%</text>
<line x1="300" y1="608" x2="300" y2="656" stroke="#ece5f2"/>
<text x="320" y="616" class="s"><tspan style="font-weight:700;fill:#c9365f">嚴重併發症</tspan>：每 100 人約 1～2 人（紅點）</text>
<circle cx="320" cy="624" r="2.2" fill="#c9365f"/><circle cx="330" cy="624" r="2.2" fill="#c9365f"/><circle cx="340" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="350" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="360" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="370" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="380" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="390" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="400" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="410" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="420" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="430" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="440" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="450" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="460" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="470" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="480" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="490" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="500" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="510" cy="624" r="2.2" fill="#ddd3e6"/><circle cx="320" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="330" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="340" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="350" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="360" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="370" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="380" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="390" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="400" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="410" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="420" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="430" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="440" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="450" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="460" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="470" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="480" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="490" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="500" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="510" cy="631" r="2.2" fill="#ddd3e6"/><circle cx="320" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="330" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="340" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="350" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="360" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="370" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="380" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="390" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="400" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="410" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="420" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="430" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="440" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="450" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="460" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="470" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="480" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="490" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="500" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="510" cy="638" r="2.2" fill="#ddd3e6"/><circle cx="320" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="330" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="340" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="350" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="360" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="370" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="380" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="390" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="400" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="410" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="420" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="430" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="440" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="450" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="460" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="470" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="480" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="490" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="500" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="510" cy="645" r="2.2" fill="#ddd3e6"/><circle cx="320" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="330" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="340" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="350" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="360" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="370" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="380" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="390" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="400" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="410" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="420" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="430" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="440" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="450" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="460" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="470" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="480" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="490" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="500" cy="652" r="2.2" fill="#ddd3e6"/><circle cx="510" cy="652" r="2.2" fill="#ddd3e6"/>
<text x="320" y="664" class="xs">其中因傳導阻滯而需裝節律器者不到 1 人</text>

<!-- ⑧ 立即就醫 -->
<rect x="20" y="670" width="519" height="44" rx="13" fill="#fff0f4" stroke="#eda8bf" stroke-width="1.7"/>
<circle cx="45" cy="692" r="12" fill="#c9365f"/><text x="45" y="697" text-anchor="middle" style="font:700 15px sans-serif;fill:#fff">!</text>
<text x="66" y="688" class="b" style="fill:#a5346a">⑧ 出現這些情況，就近就醫或立即撥打 119</text>
<text x="66" y="704" class="s" style="fill:#a5346a">穿刺處持續出血或快速腫大｜腳冰冷麻木｜胸痛｜嚴重喘｜昏厥｜發燒｜單側無力或口齒不清</text>

<!-- 來源 -->
<rect x="20" y="718" width="519" height="72" rx="10" fill="#3a2a4a"/>
<text x="31" y="734" class="srh">提醒：沒有一個適用所有人的成功率或住院天數。請向醫師詢問「我的」心律型態、預期效益與個人風險。</text>
<text x="31" y="750" class="srh">資料來源（查核至 2026-09）：</text>
