<svg xmlns="http://www.w3.org/2000/svg" width="148mm" height="210mm" viewBox="0 0 559 794">
  <defs>
    <style>
      .title{font:700 25px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#16324f}.sub{font:700 13px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#46637f}
      .h{font:700 17px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#16324f}.b{font:500 13px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#263746}
      .s{font:500 11px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#44515c}.w{font:700 13px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:white}
      .card{fill:#fff;stroke:#d8e5ec;stroke-width:1.5}.tb{font:700 11px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#16324f}.ts{font:500 8.6px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#4f6270}.tn{font:700 8.5px sans-serif;fill:#fff}.srh{font:700 6.9px 'Microsoft JhengHei',sans-serif;fill:#fff}.src{font:500 6.4px 'Microsoft JhengHei',sans-serif;fill:#dfe9f2}.cb{font:700 9.4px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#263746}.cs{font:500 8.2px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#5a6b7a}.cn{font:700 7.6px sans-serif;fill:#fff}.fn{font:500 7.6px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#6b7a88}.round{stroke-linecap:round;stroke-linejoin:round}
    </style>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18364a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="559" height="794" fill="#f3f9fb"/>
  <path d="M0 0h559v113H0z" fill="#dff3f5"/><circle cx="509" cy="26" r="54" fill="#bde7e8" opacity=".7"/>
  <!-- friendly heart character -->
  <path d="M66 29C48 9 18 22 23 50c4 22 43 42 43 42s39-20 43-42c5-28-25-41-43-21z" fill="#ef6b73" stroke="#c94555" stroke-width="2"/>
  <circle cx="51" cy="47" r="3" fill="#263746"/><circle cx="79" cy="47" r="3" fill="#263746"/><path d="M56 59q10 8 20 0" fill="none" stroke="#263746" stroke-width="2" class="round"/>
  <path d="M30 70l-15 10M100 70l15 10" stroke="#c94555" stroke-width="4" class="round"/>
  <text x="129" y="45" class="title">心率過慢｜安心觀察指南</text>
  <text x="129" y="72" class="sub">病竇症候群／房室傳導阻滯，未裝節律器的自我照顧</text>
  <rect x="129" y="83" width="294" height="23" rx="11" fill="#fff"/><text x="145" y="99" class="s">心跳可能過慢、停頓，或忽快忽慢；有症狀最重要！</text>

  <!-- emergency banner -->
  <rect x="20" y="128" width="519" height="124" rx="14" fill="#fff4f2" stroke="#f2aaa3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="55" cy="162" r="24" fill="#e74c3c"/><text x="47" y="171" style="font:700 29px sans-serif;fill:white">!</text>
  <text x="90" y="159" class="h" fill="#a72f25">立即求救：打 119</text>
  <text x="90" y="180" class="s">坐下或平躺，旁人陪伴；不要自行開車就醫</text>
  <!-- symptom icons -->
  <g transform="translate(35 196)"><circle cx="25" cy="20" r="14" fill="#ffd7b5"/><path d="M12 38q13-13 26 0" fill="#8bbbd0"/><path d="M13 7l-6-7M37 7l6-7M25 2V-7" stroke="#e74c3c" stroke-width="2"/><text x="52" y="18" class="b">昏倒、快昏倒</text><text x="52" y="37" class="s">突然倒下或意識不清</text></g>
  <g transform="translate(285 196)"><path d="M24 4C13-7-3 2 0 18c2 12 24 24 24 24s22-12 24-24C51 2 35-7 24 4z" fill="#ef6b73"/><path d="M-5 23h13l5-10 7 20 6-14 5 4h20" fill="none" stroke="#fff" stroke-width="2"/><text x="61" y="18" class="b">胸痛、呼吸困難</text><text x="61" y="37" class="s">冒冷汗、臉色發白也要警覺</text></g>

  <!-- contact soon -->
  <rect x="20" y="268" width="519" height="98" rx="14" class="card" filter="url(#shadow)"/>
  <text x="37" y="297" class="h">⚠ 儘快聯絡心臟科／就醫評估</text>
  <g transform="translate(39 315)"><circle cx="17" cy="16" r="13" fill="#ffd7b5"/><path d="M5 11q12-18 24 0" fill="#5b6f8c"/><path d="M5 31q12-10 24 0" fill="#75b7c8"/><path d="M34 4q9 10 0 20" fill="none" stroke="#f4b63e" stroke-width="3"/><text x="48" y="14" class="b">反覆頭暈、虛弱、疲倦</text><text x="48" y="34" class="s">活動變喘、注意力變差、跌倒</text></g>
  <g transform="translate(293 315)"><circle cx="18" cy="17" r="16" fill="#ffe6a8"/><path d="M18 17V7M18 17l8 5" stroke="#495869" stroke-width="2" class="round"/><path d="M3 18h7l3-7 5 14 4-10 4 3h8" fill="none" stroke="#e45b64" stroke-width="2"/><text x="49" y="14" class="b">心悸或脈搏異常</text><text x="49" y="34" class="s">很慢、忽快忽慢，且伴隨不適</text></g>

  <!-- causes -->
  <rect x="20" y="382" width="245" height="244" rx="14" class="card" filter="url(#shadow)"/><text x="37" y="409" class="h">為什麼會發生？</text><g transform="translate(36 415)"><path d="M24 10C19 2 7 3 5 13c-2 10 7 19 19 29 12-10 21-19 19-29-2-10-14-11-19-3z" fill="#ffeaea" stroke="#e6a9a9" stroke-width="1.6"/><path d="M17 16q3 6 7 9" fill="none" stroke="#9fb4c6" stroke-width="1.6" stroke-dasharray="2.5 2.5" class="round"/><path d="M24 32l-5 8M24 32l6 7.5" fill="none" stroke="#9fb4c6" stroke-width="1.6" stroke-dasharray="2.5 2.5" class="round"/><circle cx="17" cy="15" r="6" fill="#f4b63e"/><text x="17" y="17.6" text-anchor="middle" class="cn">1</text><circle cx="24" cy="26" r="6" fill="#5e8fbf"/><text x="24" y="28.6" text-anchor="middle" class="cn">2</text></g><circle cx="98" cy="427" r="5.6" fill="#f4b63e"/><text x="98" y="429.6" text-anchor="middle" class="cn">1</text><text x="108" y="430" class="cb">竇房結：發動心跳</text><text x="108" y="441" class="cs">出問題 → <tspan style="fill:#b7791f;font-weight:700">病竇症候群</tspan></text><circle cx="98" cy="455" r="5.6" fill="#5e8fbf"/><text x="98" y="457.6" text-anchor="middle" class="cn">2</text><text x="108" y="458" class="cb">房室結：傳遞心跳</text><text x="108" y="469" class="cs">出問題 → <tspan style="fill:#2f6ea3;font-weight:700">房室傳導阻滯</tspan></text><g transform="translate(34 481)"><rect width="69" height="52" rx="8" fill="#f6fafc" stroke="#dcebf2"/><circle cx="34.5" cy="14" r="11" fill="#fdf0dd"/><path d="M30 6h9l-4.5 8zM30 22h9l-4.5-8z" fill="#c98a3a"/><path d="M28.5 6h12M28.5 22h12" stroke="#c98a3a" stroke-width="2" class="round"/><text x="34.5" y="35" text-anchor="middle" class="cb">老化退化</text><text x="34.5" y="45.5" text-anchor="middle" class="cs">最常見</text></g><g transform="translate(108 481)"><rect width="69" height="52" rx="8" fill="#f6fafc" stroke="#dcebf2"/><circle cx="34.5" cy="14" r="11" fill="#ffe6e3"/><path d="M25 14h19" stroke="#e08a86" stroke-width="6.5" class="round"/><path d="M26 14h17" stroke="#fff" stroke-width="2.8" class="round"/><circle cx="36" cy="14" r="3.4" fill="#cf554b"/><text x="34.5" y="35" text-anchor="middle" class="cb">心肌缺氧</text><text x="34.5" y="45.5" text-anchor="middle" class="cs">或心肌梗塞</text></g><g transform="translate(182 481)"><rect width="69" height="52" rx="8" fill="#f6fafc" stroke="#dcebf2"/><circle cx="34.5" cy="14" r="11" fill="#e7f2ff"/><g transform="rotate(-22 34.5 14)"><rect x="26" y="10.2" width="17" height="7.6" rx="3.8" fill="#7aa7d4"/><path d="M34.5 10.2v7.6" stroke="#fff" stroke-width="1.6"/></g><circle cx="60" cy="8" r="3.2" fill="#5a9340"/><text x="34.5" y="35" text-anchor="middle" class="cb">藥物影響</text><text x="34.5" y="45.5" text-anchor="middle" class="cs">常見可逆</text></g><g transform="translate(34 537)"><rect width="69" height="52" rx="8" fill="#f6fafc" stroke="#dcebf2"/><circle cx="34.5" cy="14" r="11" fill="#e2f4f0"/><path d="M31 6h7v13a3.5 3.5 0 0 1-7 0z" fill="none" stroke="#3f9184" stroke-width="1.9"/><path d="M31.4 13.5h6.2V19a3.1 3.1 0 0 1-6.2 0z" fill="#3f9184"/><path d="M29 5.6h11" stroke="#3f9184" stroke-width="2" class="round"/><circle cx="60" cy="8" r="3.2" fill="#5a9340"/><text x="34.5" y="35" text-anchor="middle" class="cb">甲狀腺低下</text><text x="34.5" y="45.5" text-anchor="middle" class="cs">電解質異常</text></g><g transform="translate(108 537)"><rect width="69" height="52" rx="8" fill="#f6fafc" stroke="#dcebf2"/><circle cx="34.5" cy="14" r="11" fill="#ffeceb"/><path d="M34.5 8.4c-2.3-3.2-7.4-2.6-8.3 1.4-.9 4 2.8 7.4 8.3 11.6 5.5-4.2 9.2-7.6 8.3-11.6-.9-4-6-4.6-8.3-1.4z" fill="#eb9a95"/><g transform="rotate(-35 34.5 13.5)"><rect x="28" y="11" width="13" height="5" rx="2.5" fill="#fff" opacity=".92"/><circle cx="34.5" cy="13.5" r="1.1" fill="#eb9a95"/></g><text x="34.5" y="35" text-anchor="middle" class="cb">心臟手術</text><text x="34.5" y="45.5" text-anchor="middle" class="cs">或電燒之後</text></g><g transform="translate(182 537)"><rect width="69" height="52" rx="8" fill="#f6fafc" stroke="#dcebf2"/><circle cx="34.5" cy="14" r="11" fill="#ece8fa"/><path d="M32.5 6.6a8 8 0 1 0 7.4 11 8.6 8.6 0 0 1-7.4-11z" fill="#7b6fb5"/><path d="M39.5 5h5l-5 5.4h5" fill="none" stroke="#7b6fb5" stroke-width="1.5" class="round"/><circle cx="60" cy="8" r="3.2" fill="#5a9340"/><text x="34.5" y="35" text-anchor="middle" class="cb">睡眠呼吸</text><text x="34.5" y="45.5" text-anchor="middle" class="cs">中止症</text></g><circle cx="38" cy="604" r="3.2" fill="#5a9340"/><text x="46" y="607" class="fn">為可逆因素，找出並處理後心跳可能恢復</text><text x="37" y="619" class="fn">其他：感染發炎、浸潤性心臟病等；確切原因需醫師檢查判斷</text>

  <!-- daily care -->
  <rect x="279" y="382" width="260" height="244" rx="14" class="card" filter="url(#shadow)"/>
  <text x="296" y="411" class="h">平常這樣做</text>
  <g transform="translate(298 426)"><rect x="0" y="0" width="32" height="32" rx="6" fill="#dff3f5"/><path d="M8 10h16M8 17h16M8 24h10" stroke="#368696" stroke-width="2"/><text x="43" y="12" class="b">記錄症狀、脈搏與時間</text><text x="43" y="29" class="s">回診帶紀錄；依醫囑量血壓</text></g>
  <g transform="translate(298 465)"><circle cx="16" cy="16" r="16" fill="#eaf4d8"/><path d="M10 18l5 5 10-14" fill="none" stroke="#5a9340" stroke-width="3" class="round"/><text x="43" y="12" class="b">按時回診、完成監測</text><text x="43" y="29" class="s">如心電圖、24 小時心電圖</text></g>
  <g transform="translate(298 504)"><rect x="2" y="3" width="28" height="28" rx="14" fill="#ffe2df"/><path d="M8 18h16M16 10v16" stroke="#cf554b" stroke-width="3"/><text x="43" y="12" class="b">藥物主動核對</text><text x="43" y="29" class="s">勿自行停藥、加藥或吃偏方</text></g>
  <g transform="translate(298 543)"><circle cx="16" cy="16" r="16" fill="#e8e2fa"/><path d="M9 8h8v8h8v8h-8" fill="none" stroke="#6d5ba7" stroke-width="3" class="round"/><text x="43" y="12" class="b">避免跌倒與意外</text><text x="43" y="29" class="s">慢慢起身；頭暈時勿開車、登高</text></g><g transform="translate(298 582)"><rect x="2" y="8" width="28" height="22" rx="4" fill="#fde7cf"/><path d="M11 8V5.5a5 5 0 0 1 10 0V8" fill="none" stroke="#d08a3c" stroke-width="2.4" class="round"/><path d="M2 16h28" stroke="#d08a3c" stroke-width="2"/><text x="43" y="12" class="b">外出攜帶藥單與聯絡人</text><text x="43" y="29" class="s">告知家人警訊與求救方式</text></g>

  <!-- treatment -->
  <rect x="20" y="642" width="519" height="88" rx="13" fill="#eaf6f4" stroke="#a9d5cd"/><text x="37" y="663" class="h">可能的治療</text><text x="140" y="663" class="fn">依 2018 ACC/AHA/HRS 與 2021 ESC 指引；需由醫師個別評估</text><circle cx="45" cy="678" r="8" fill="#368696"/><text x="45" y="681" text-anchor="middle" class="tn">1</text><text x="59" y="682" class="tb">先處理可逆原因</text><text x="59" y="696" class="ts">調整或停用減慢心跳的藥物、</text><text x="59" y="707" class="ts">治療甲狀腺低下與電解質異常</text><circle cx="211" cy="678" r="8" fill="#368696"/><text x="211" y="681" text-anchor="middle" class="tn">2</text><text x="225" y="682" class="tb">沒有症狀：先觀察</text><text x="225" y="696" class="ts">以心電圖、24 小時或長程監測，</text><text x="225" y="707" class="ts">確認症狀與心跳過慢是否相關</text><circle cx="377" cy="678" r="8" fill="#368696"/><text x="377" y="681" text-anchor="middle" class="tn">3</text><text x="391" y="682" class="tb">有症狀：心臟節律器</text><text x="391" y="696" class="ts">無長期加快心跳的藥物；可選</text><text x="391" y="707" class="ts">傳統／無導線／傳導系統節律</text><text x="37" y="723" class="fn">※ 第二度 II 型或完全性房室傳導阻滯，即使沒有症狀通常仍建議植入節律器；是否植入需與醫師共同決策。</text>
  <!-- sources -->
  <rect x="20" y="740" width="519" height="48" rx="8" fill="#244d6b"/><text x="31" y="752" class="srh">資料來源（查核至 2026-08）：</text><text x="31" y="762" class="src">2018 ACC/AHA/HRS Guideline on the Evaluation and Management of Patients With Bradycardia and Cardiac Conduction Delay；</text><text x="31" y="772" class="src">2021 ESC Guidelines on Cardiac Pacing and Cardiac Resynchronization Therapy；2025 ACC/AHA/HRS Appropriate Use Criteria for ICD, CRT and Pacing。</text><text x="31" y="782" class="src">本單張供醫病共同決策，不取代個別診療；實際治療需由心臟科／電生理醫師個別評估。</text>
