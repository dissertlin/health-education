<defs><style>
.t{font:700 23px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#fff}
.st{font:600 10.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#fce7e7}
.h{font:700 14.5px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#4a1f22}
.b{font:700 10.2px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#5a2a2c}
.s{font:500 8.7px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#6b5052}
.xs{font:500 7.2px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#836669}
.src{font:500 6.4px 'Microsoft JhengHei',sans-serif;fill:#f0e2e2}
.srh{font:700 6.8px 'Microsoft JhengHei',sans-serif;fill:#fff}
.card{fill:#fff;stroke:#ecdcdc;stroke-width:1.3}
.line{stroke-linecap:round;stroke-linejoin:round}
</style>
<linearGradient id="g" x1="0" x2="1"><stop stop-color="#b33a2b"/><stop offset="1" stop-color="#7a2440"/></linearGradient>
<filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#4a1f22" flood-opacity=".12"/></filter></defs>
<rect width="559" height="794" fill="#fdf8f7"/>

<!-- 標題 -->
<rect x="18" y="14" width="523" height="93" rx="16" fill="url(#g)"/>
<g transform="translate(36 28)">
<path d="M32 62C18 48 6 38 6 25 6 15 13 9 21 9c5 0 9 2.5 11 6 2-3.5 6-6 11-6 8 0 15 6 15 16 0 13-12 23-26 37z" fill="#ef7b74" stroke="#a8322c" stroke-width="2.4"/>
<circle cx="24" cy="26" r="2.4" fill="#4a1f22"/><circle cx="41" cy="26" r="2.4" fill="#4a1f22"/>
<path d="M25 38q8-6 15 0" fill="none" stroke="#4a1f22" stroke-width="2" class="line"/>
<path d="M50 14l8-6M56 24l10-3M52 34l9 4" stroke="#ffd2cd" stroke-width="2.6" class="line"/>
</g>
<text x="112" y="46" class="t">認識心絞痛</text>
<text x="112" y="68" class="st">心臟的血管變窄，供血跟不上需求時，胸口就會發出警訊</text>
<rect x="112" y="79" width="330" height="19" rx="9.5" fill="#fff"/>
<text x="124" y="92" class="s"><tspan style="font-weight:700;fill:#a8322c">它是提醒，不是終點</tspan>——控制得好，可以過正常生活</text>

<!-- ① 什麼是心絞痛 -->
<rect x="20" y="118" width="253" height="112" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="140" class="h">① 什麼是心絞痛？</text>
<g transform="translate(36 146)">
<rect x="0" y="6" width="96" height="30" rx="15" fill="#fff" stroke="#8a6a6a" stroke-width="2.2"/>
<rect x="5" y="11" width="86" height="20" rx="10" fill="#e8746e"/>
<text x="48" y="52" text-anchor="middle" class="xs">血流順暢</text>
<path d="M104 21h14" stroke="#a8322c" stroke-width="2.4" class="line"/>
<path d="M114 17l5 4-5 4" stroke="#a8322c" stroke-width="2.4" fill="none" class="line"/>
<rect x="126" y="6" width="96" height="30" rx="15" fill="#fff" stroke="#8a6a6a" stroke-width="2.2"/>
<path d="M131 11h86a10 10 0 0 1 0 20h-86a10 10 0 0 1 0-20z" fill="#e8746e"/>
<path d="M158 10q18-2 28 8-14 7-28 5z" fill="#f0c44e" stroke="#c99a2e" stroke-width="1.4"/>
<path d="M196 32q-18 2-28-8 14-7 28-5z" fill="#f0c44e" stroke="#c99a2e" stroke-width="1.4"/>
<text x="174" y="52" text-anchor="middle" class="xs">脂肪斑塊讓管腔變窄</text>
</g>
<text x="37" y="209" class="s">心臟自己也需要血液。<tspan style="font-weight:700">冠狀動脈</tspan>因斑塊變窄時，</text>
<text x="37" y="222" class="s"><tspan style="font-weight:700;fill:#a8322c">用力或情緒激動就會供血不足</tspan>，心肌缺氧而胸悶痛。</text>

<!-- ② 危險因子 -->
<rect x="287" y="118" width="252" height="112" rx="13" class="card" filter="url(#sh)"/>
<text x="304" y="140" class="h">② 危險因子有哪些？</text>
<text x="304" y="157" class="b" style="fill:#a8322c">可以改變的（治療重點）</text>
<text x="304" y="170" class="s">抽菸　高血壓　高血脂　糖尿病</text>
<text x="304" y="182" class="s">肥胖　久坐不動　壓力大　睡眠差</text>
<text x="304" y="199" class="b">不能改變的</text>
<text x="304" y="212" class="s">年齡（男 ≥45、女 ≥55）、男性、</text>
<text x="304" y="224" class="s">早發性冠心病家族史、慢性腎臟病</text>

<!-- ③ 症狀 -->
<rect x="20" y="238" width="519" height="96" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="260" class="h">③ 有哪些症狀？</text>
<rect x="36" y="268" width="240" height="56" rx="9" fill="#fdeeec"/>
<text x="49" y="283" class="b" style="fill:#a8322c">典型的樣子</text>
<text x="49" y="296" class="s">胸口悶、壓、緊，像被大石頭壓住</text>
<text x="49" y="308" class="s">可傳到左肩、手臂、下巴、上腹</text>
<text x="49" y="320" class="s" style="font-weight:700">用力時出現、休息幾分鐘會緩解</text>
<rect x="283" y="268" width="240" height="56" rx="9" fill="#fdf6ec"/>
<text x="296" y="283" class="b" style="fill:#a06a14">不典型的樣子（容易被忽略）</text>
<text x="296" y="296" class="s">只覺得喘、疲倦、冒冷汗、噁心</text>
<text x="296" y="308" class="s">或像胃痛、牙痛、背痛</text>
<text x="296" y="320" class="s" style="font-weight:700">女性、糖尿病與長者特別常見</text>

<!-- ④ 怎麼確診 -->
<rect x="20" y="342" width="519" height="74" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="364" class="h">④ 醫師會做什麼檢查？</text>
<text x="215" y="364" class="xs">依症狀與風險高低選擇，不是每一項都要做</text>
<text x="37" y="382" class="s"><tspan style="font-weight:700">基本</tspan>　心電圖、抽血（心肌酵素、血脂、血糖、腎功能）、心臟超音波</text>
<text x="37" y="395" class="s"><tspan style="font-weight:700">看缺氧</tspan>　運動心電圖、核子醫學心肌灌注掃描、運動或藥物負荷心臟超音波</text>
<text x="37" y="408" class="s"><tspan style="font-weight:700">看血管</tspan>　電腦斷層冠狀動脈攝影（非侵入性）；<tspan style="font-weight:700;fill:#a8322c">心導管冠狀動脈攝影是確診與治療的黃金標準</tspan></text>

<!-- ⑤ 治療 -->
<rect x="20" y="424" width="519" height="86" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="446" class="h">⑤ 有哪些治療？</text>
<text x="175" y="446" class="xs">藥物是所有人的基礎；是否放支架或開刀，依血管狹窄程度與症狀決定</text>
<rect x="36" y="454" width="158" height="48" rx="9" fill="#fdeeec"/>
<text x="47" y="469" class="b" style="fill:#a8322c">藥物治療（基礎）</text>
<text x="47" y="482" class="s">抗血小板藥、statin、</text>
<text x="47" y="493" class="s">乙型阻斷劑、硝化甘油等</text>
<rect x="200" y="454" width="158" height="48" rx="9" fill="#fdf6ec"/>
<text x="211" y="469" class="b" style="fill:#a06a14">心導管介入（放支架）</text>
<text x="211" y="482" class="s">從手腕或鼠蹊部放入導管，</text>
<text x="211" y="493" class="s">撐開狹窄處並置放支架</text>
<rect x="364" y="454" width="159" height="48" rx="9" fill="#f2eef6"/>
<text x="375" y="469" class="b" style="fill:#6b3f8e">冠狀動脈繞道手術</text>
<text x="375" y="482" class="s">多條或左主幹嚴重阻塞、</text>
<text x="375" y="493" class="s">合併糖尿病者常優先考慮</text>

<!-- ⑥ 要配合什麼 -->
<rect x="20" y="518" width="519" height="100" rx="13" class="card" filter="url(#sh)"/>
<text x="37" y="540" class="h">⑥ 我要配合做什麼？</text>
<text x="195" y="540" class="xs">目標值請以醫師為您設定的為準</text>
<g class="line">
<rect x="36" y="548" width="118" height="26" rx="8" fill="#fdeeec"/>
<text x="46" y="560" class="b" style="fill:#a8322c">壞膽固醇 LDL</text><text x="46" y="571" class="s" style="font-weight:700">&lt; 70 mg/dL</text>
<rect x="160" y="548" width="118" height="26" rx="8" fill="#fdeeec"/>
<text x="170" y="560" class="b" style="fill:#a8322c">居家血壓</text><text x="170" y="571" class="s" style="font-weight:700">&lt; 130 / 80 mmHg</text>
<rect x="284" y="548" width="118" height="26" rx="8" fill="#fdeeec"/>
<text x="294" y="560" class="b" style="fill:#a8322c">糖化血色素</text><text x="294" y="571" class="s" style="font-weight:700">一般 &lt; 7%</text>
<rect x="408" y="548" width="115" height="26" rx="8" fill="#fdeeec"/>
<text x="418" y="560" class="b" style="fill:#a8322c">身體質量指數</text><text x="418" y="571" class="s" style="font-weight:700">BMI 18.5～24</text>
</g>
<text x="37" y="590" class="s"><tspan style="font-weight:700">運動</tspan>　每週 150 分鐘中等強度（快走、騎車）；<tspan style="font-weight:700">先問醫師可以做到什麼程度</tspan></text>
<text x="37" y="602" class="s"><tspan style="font-weight:700">飲食</tspan>　少油少鹽少糖、多蔬果全穀與魚；<tspan style="font-weight:700">戒菸是所有措施中效益最大的一項</tspan></text>
<text x="37" y="612" class="s" style="fill:#a8322c">放過支架者的抗血小板藥，未經醫師同意絕對不可自行停用。</text>

<!-- ⑦ 立即就醫 -->
<rect x="20" y="622" width="519" height="70" rx="13" fill="#fff0ee" stroke="#eda8a4" stroke-width="1.7"/>
<circle cx="45" cy="645" r="12" fill="#c0392b"/><text x="45" y="650" text-anchor="middle" style="font:700 15px sans-serif;fill:#fff">!</text>
<text x="66" y="641" class="b" style="fill:#a8322c">⑦ 出現這些情況，立即撥打 119</text>
<text x="66" y="656" class="s" style="fill:#a8322c">胸痛持續超過 15～20 分鐘不緩解｜休息時也發作｜比平常更痛、更頻繁｜冒冷汗、喘、快昏倒</text>
<text x="66" y="670" class="s"><tspan style="font-weight:700">舌下含片用法</tspan>　坐下含 1 錠，5 分鐘未緩解再含 1 錠，最多 3 錠；仍不緩解 → 立即 119。</text>
<text x="66" y="683" class="s" style="fill:#a8322c"><tspan style="font-weight:700">切勿與壯陽藥（威而鋼等）併用</tspan>，可能造成嚴重低血壓。</text>

<!-- 來源 -->
<rect x="20" y="700" width="519" height="90" rx="10" fill="#3d2326"/>
<text x="31" y="718" class="srh">提醒：心絞痛型態改變（更痛、更久、更頻繁，或休息時發作）代表病情可能惡化，請盡快就醫。</text>
<text x="31" y="735" class="srh">資料來源（查核至 2026-09）：</text>
<text x="31" y="747" class="src">2024 ESC 慢性冠心症候群指引；2023 AHA/ACC 慢性冠狀動脈疾病指引；</text>
<text x="31" y="758" class="src">2024 中華民國心臟學會 ASCVD 初級預防指引；2025 台灣血脂管理臨床路徑共識；</text>
<text x="31" y="769" class="src">2022 台灣高血壓治療指引；台灣糖尿病學會臨床照護指引。本單張供衛教使用，不取代個別診療。</text>
