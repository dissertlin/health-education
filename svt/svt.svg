<defs><style>
.t{font:700 23px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#fff}
.st{font:600 11px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#ffeaf0}
.h{font:700 15px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#3a1d47}
.b{font:700 10.4px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#43304f}
.s{font:500 8.8px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#5e5068}
.xs{font:500 7.2px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#75677f}
.cap{font:700 8.4px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#43304f}
.src{font:500 6.4px 'Microsoft JhengHei',sans-serif;fill:#e9dff0}
.srh{font:700 6.8px 'Microsoft JhengHei',sans-serif;fill:#fff}
