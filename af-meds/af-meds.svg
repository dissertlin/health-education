<metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/"><rdf:Description><dc:title>心房顫動的用藥指南｜A5 病人衛教單張</dc:title><dc:creator>林祐賸醫師</dc:creator><dc:rights>© 2026 林祐賸醫師 編製。本單張僅供臨床衛教使用，未經同意不得重製、改作或作商業用途。</dc:rights><dc:source>https://dissertlin.github.io/health-education/af-meds/</dc:source></rdf:Description></rdf:RDF></metadata>
<defs><style>.t{font:700 24px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:white}.st{font:600 12px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#ffe8ed}.h{font:700 18px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#1e3047}.hh{font:700 16px 'Microsoft JhengHei','Noto Sans TC',sans-serif}.b{font:700 13px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#293a4e}.s{font:500 11px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#4c5e73}.xs{font:500 9px 'Microsoft JhengHei','Noto Sans TC',sans-serif;fill:#68778a}.line{stroke-linecap:round;stroke-linejoin:round}.card{fill:#fff;stroke:#dce5ee;stroke-width:1.5}</style><linearGradient id="r" x1="0" x2="1"><stop stop-color="#f34164"/><stop offset="1" stop-color="#df241f"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b3149" flood-opacity=".12"/></filter></defs>
<rect width="559" height="794" fill="#f5f8fc"/>
<!-- title -->
<rect x="18" y="18" width="523" height="103" rx="17" fill="url(#r)"/><path d="M29 67h25l8-26 13 47 13-31 9 10h28" fill="none" stroke="#ff8fa1" stroke-width="7" opacity=".45" class="line"/><text x="44" y="57" class="t">心房顫動的用藥指南</text><text x="44" y="84" class="st">為什麼需要同時使用兩種不同作用的藥物？</text><text x="44" y="104" class="st">因為心房顫動會帶來「血栓中風」與「心跳紊亂」兩大問題</text>
<!-- AF central explanation -->
<rect x="20" y="136" width="519" height="104" rx="15" class="card" filter="url(#sh)"/>
<g transform="translate(35 151)"><path d="M30 12C16-3-5 7-1 28c3 15 31 31 31 31s28-16 31-31C65 7 44-3 30 12z" fill="#f06c78"/><path d="M-2 33h13l5-11 8 23 7-17 6 5h24" fill="none" stroke="#fff" stroke-width="3" class="line"/><circle cx="22" cy="27" r="2.5" fill="#26384c"/><circle cx="39" cy="27" r="2.5" fill="#26384c"/></g>
<text x="112" y="162" class="h">心房顫動：心房在「發抖、漏電」</text><text x="112" y="184" class="s">心房無法規律收縮，血液流動變慢，可能形成血栓；心跳也可能忽快忽慢，</text><text x="112" y="202" class="s">讓人心悸、喘、疲倦，長期可能增加心臟負擔。</text><rect x="112" y="211" width="382" height="20" rx="10" fill="#fff1f3"/><text x="128" y="225" class="s" style="font-weight:700;fill:#ce3150">所以需要兩種「分工不同」的藥物，分別處理兩個風險。</text>
<!-- two big problem cards -->
<rect x="20" y="256" width="253" height="347" rx="16" fill="#fff" stroke="#b9d4ff" stroke-width="1.7" filter="url(#sh)"/><path d="M20 272a16 16 0 0116-16h221a16 16 0 0116 16v67H20z" fill="#eaf3ff"/><rect x="36" y="271" width="48" height="48" rx="13" fill="#4082ef"/><path d="M60 280c-2 9-12 13-12 22a12 12 0 0024 0c0-9-10-13-12-22z" fill="none" stroke="#fff" stroke-width="4" class="line"/><text x="96" y="291" class="hh" style="fill:#174998">問題一：血栓與腦中風</text><text x="96" y="314" class="s" style="fill:#2d61aa">抗凝血劑負責「防堵塞」</text>
<!-- flow left -->
<g transform="translate(39 355)"><path d="M18 5C8-6-7 2-4 18c2 11 22 23 22 23s20-12 22-23C43 2 28-6 18 5z" fill="#ef6b77"/><path d="M50 21h23" stroke="#9eafc1" stroke-width="2"/><path d="M68 15l7 6-7 6" fill="none" stroke="#9eafc1" stroke-width="2"/><circle cx="91" cy="21" r="11" fill="#e95058"/><path d="M110 21h23" stroke="#9eafc1" stroke-width="2"/><path d="M128 15l7 6-7 6" fill="none" stroke="#9eafc1" stroke-width="2"/><path d="M153 7q15 13 0 28q-15-13 0-28z" fill="#9fb2ca"/><text x="18" y="59" text-anchor="middle" class="xs">血流變慢</text><text x="91" y="59" text-anchor="middle" class="xs">形成血栓</text><text x="153" y="59" text-anchor="middle" class="xs">堵住腦血管</text></g>
<text x="38" y="435" class="b">為什麼要吃抗凝血劑？</text><text x="38" y="457" class="s">降低血液形成血栓的能力，減少血栓跑到</text><text x="38" y="476" class="s">腦部造成缺血性腦中風的風險。</text>
<rect x="36" y="492" width="221" height="53" rx="11" fill="#edf5ff"/><text x="50" y="513" class="b" style="fill:#2459a6">保護重點：大腦</text><text x="50" y="532" class="s">沒有心悸，也不代表可以自行停藥。</text>
<g transform="translate(39 557)"><circle cx="13" cy="13" r="13" fill="#fff0ed"/><path d="M13 5v10M13 21v1" stroke="#df4a45" stroke-width="3" class="line"/><text x="34" y="10" class="b">主要安全提醒</text><text x="34" y="28" class="s">異常出血、黑便或撞頭須儘快就醫</text></g>

<rect x="287" y="256" width="252" height="347" rx="16" fill="#fff" stroke="#a9eadf" stroke-width="1.7" filter="url(#sh)"/><path d="M287 272a16 16 0 0116-16h220a16 16 0 0116 16v67H287z" fill="#e9faf7"/><rect x="303" y="271" width="48" height="48" rx="13" fill="#16b5a5"/><path d="M327 277l-11 19h11l-5 17 16-23h-11l5-13" fill="none" stroke="#fff" stroke-width="4" class="line"/><text x="363" y="291" class="hh" style="fill:#08766d">問題二：心跳紊亂</text><text x="363" y="314" class="s" style="fill:#12877d">心跳與節律藥負責「穩心跳」</text>
<!-- flow right -->
<g transform="translate(306 355)"><path d="M3 22h12l5-14 9 28 8-19 7 5h20" fill="none" stroke="#ea4864" stroke-width="3" class="line"/><path d="M70 22h23" stroke="#9eafc1" stroke-width="2"/><path d="M88 16l7 6-7 6" fill="none" stroke="#9eafc1" stroke-width="2"/><path d="M113 6C102-5 87 3 90 19c2 12 23 24 23 24s21-12 23-24c3-16-12-24-23-13z" fill="#ef6b77"/><path d="M142 22h22" stroke="#9eafc1" stroke-width="2"/><path d="M159 16l7 6-7 6" fill="none" stroke="#9eafc1" stroke-width="2"/><circle cx="181" cy="22" r="15" fill="#e9faf7"/><path d="M172 22h5l3-7 5 14 3-7h5" fill="none" stroke="#16a99b" stroke-width="2"/><text x="31" y="59" text-anchor="middle" class="xs">心跳亂／過快</text><text x="113" y="59" text-anchor="middle" class="xs">心臟較費力</text><text x="181" y="59" text-anchor="middle" class="xs">節律較穩定</text></g>
<text x="304" y="435" class="b">為什麼要吃心跳／節律的藥？</text><text x="304" y="457" class="s">控制心跳速度：讓心跳不要太快；</text><text x="304" y="476" class="s">維持節律：用藥物幫助恢復規律心跳。</text>
<rect x="303" y="492" width="220" height="53" rx="11" fill="#ebfaf7"/><text x="317" y="513" class="b" style="fill:#087c72">保護重點：心臟與生活品質</text><text x="317" y="532" class="s">藥物選擇依心臟狀況及檢查結果而定。</text>
<g transform="translate(306 557)"><circle cx="13" cy="13" r="13" fill="#fff3ce"/><path d="M13 13V5M13 13l6 4" stroke="#d99a20" stroke-width="2" class="line"/><text x="34" y="10" class="b">主要安全提醒</text><text x="34" y="28" class="s">昏倒、胸痛、喘加劇或心跳過慢要就醫</text></g>
<!-- concise safety -->
<rect x="20" y="620" width="519" height="99" rx="15" fill="#fff" stroke="#dce5ee" stroke-width="1.5" filter="url(#sh)"/><text x="37" y="642" class="h">兩種藥都要記得</text>
<g transform="translate(38 655)"><circle cx="13" cy="13" r="13" fill="#e8f2ff"/><path d="M7 14l4 4 8-10" fill="none" stroke="#397bdc" stroke-width="3" class="line"/><text x="34" y="10" class="b">固定時間服用</text><text x="34" y="27" class="s">漏服勿吃雙倍</text></g>
<g transform="translate(205 655)"><circle cx="13" cy="13" r="13" fill="#e9faf7"/><path d="M6 13h14M13 6v14" stroke="#16a99b" stroke-width="3" class="line"/><text x="34" y="10" class="b">新藥先詢問</text><text x="34" y="27" class="s">包含成藥與保健品</text></g>
<g transform="translate(374 655)"><circle cx="13" cy="13" r="13" fill="#fff0ed"/><path d="M13 5v10M13 21v1" stroke="#df4a45" stroke-width="3" class="line"/><text x="34" y="10" class="b">不可自行停藥</text><text x="34" y="27" class="s">手術拔牙前也先詢問</text></g>
<rect x="37" y="691" width="485" height="20" rx="10" fill="#fff0ed"/><text x="279" y="705" text-anchor="middle" class="s" style="font-weight:700;fill:#bd354a">出血不止、昏倒、胸痛、呼吸困難或中風症狀：立即打 119</text>
<!-- footer -->
<!-- APHRS reminders -->
<rect x="20" y="727" width="519" height="52" rx="12" fill="#eef4fb" stroke="#b9d3ea"/><text x="37" y="743" class="b" style="fill:#22599a">依亞太心律學會指引，亞洲病人的三個重點</text><text x="37" y="760" class="s">① 抗凝血劑優先使用新型口服藥　② 不可自行減量 —— 減量不會比較安全</text><text x="37" y="773" class="s">③ 阿斯匹靈不能取代抗凝血劑，單吃阿斯匹靈無法預防心房顫動造成的中風</text>
<text x="535" y="791" text-anchor="end" class="xs">A5 直式｜心房顫動用藥病人衛教｜本單張不能取代醫師診療｜© 2026 林祐賸醫師 編製</text>
